<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="pt pd"><title id="pt">Из сетки patches в последовательность токенов</title><desc id="pd">Четыре квадрата разворачиваются в четыре вектора. Общая проекция сохраняет число patches; позиции сообщают исходное место.</desc><rect width="900" height="440" fill="#f5f8f5" rx="16"/><g font-family="Segoe UI,sans-serif" fill="#213244"><text x="30" y="38" font-size="24">Patch — область изображения, token — её вектор признаков</text>
<rect x="40" y="80" width="96" height="96" fill="#bee3d5" stroke="#607780"/><text x="69" y="136" font-size="25">P1</text>
<rect x="470" y="85" width="350" height="44" fill="#bee3d5" stroke="#607780"/><text x="488" y="114" font-size="20">z1 = flatten(P1) E + b + pos1</text>
<rect x="140" y="80" width="96" height="96" fill="#f3d6ab" stroke="#607780"/><text x="169" y="136" font-size="25">P2</text>
<rect x="470" y="147" width="350" height="44" fill="#f3d6ab" stroke="#607780"/><text x="488" y="176" font-size="20">z2 = flatten(P2) E + b + pos2</text>
<rect x="40" y="180" width="96" height="96" fill="#bfdaef" stroke="#607780"/><text x="69" y="236" font-size="25">P3</text>
<rect x="470" y="209" width="350" height="44" fill="#bfdaef" stroke="#607780"/><text x="488" y="238" font-size="20">z3 = flatten(P3) E + b + pos3</text>
<rect x="140" y="180" width="96" height="96" fill="#ddc9e9" stroke="#607780"/><text x="169" y="236" font-size="25">P4</text>
<rect x="470" y="271" width="350" height="44" fill="#ddc9e9" stroke="#607780"/><text x="488" y="300" font-size="20">z4 = flatten(P4) E + b + pos4</text>
<path d="M260 180H430M415 170L430 180L415 190" stroke="#17645e" stroke-width="3" fill="none"/><text x="285" y="155" font-size="18">одна общая E</text><text x="40" y="315" font-size="19">Пример: сетка 2 × 2</text><text x="470" y="365" font-size="19">4 строки × D признаков</text><text x="40" y="400" font-size="18">В реальном ViT перед этой последовательностью можно добавить отдельный CLS.</text></g></svg>