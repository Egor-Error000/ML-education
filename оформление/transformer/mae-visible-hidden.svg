<text x="223" y="137" font-size="18">4</text>
<rect x="45" y="160" width="51" height="51" rx="3" fill="#bee3d5"/>
<text x="58" y="192" font-size="18">5</text>
<rect x="100" y="160" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="113" y="192" font-size="18">6</text>
<rect x="155" y="160" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="168" y="192" font-size="18">7</text>
<rect x="210" y="160" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="223" y="192" font-size="18">8</text>
<rect x="45" y="215" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="58" y="247" font-size="18">9</text>
<rect x="100" y="215" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="113" y="247" font-size="18">10</text>
<rect x="155" y="215" width="51" height="51" rx="3" fill="#bee3d5"/>
<text x="168" y="247" font-size="18">11</text>
<rect x="210" y="215" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="223" y="247" font-size="18">12</text>
<rect x="45" y="270" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="58" y="302" font-size="18">13</text>
