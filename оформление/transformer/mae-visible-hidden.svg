<text x="113" y="302" font-size="18">14</text>
<rect x="155" y="270" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="168" y="302" font-size="18">15</text>
<rect x="210" y="270" width="51" height="51" rx="3" fill="#bee3d5"/>
<text x="223" y="302" font-size="18">16</text>
<rect x="340" y="110" width="520" height="86" rx="9" fill="white" stroke="#adc8bb"/>
<text x="360" y="140" font-size="21">Encoder: 4 токена (+ CLS)</text>
<text x="360" y="172" font-size="17">Контекст строится по видимым областям.</text>
<rect x="340" y="220" width="520" height="86" rx="9" fill="white" stroke="#adc8bb"/>
<text x="360" y="250" font-size="21">Decoder: 16 позиций (+ CLS)</text>
<text x="360" y="282" font-size="17">Скрытые места получают mask tokens.</text>
<rect x="340" y="330" width="520" height="86" rx="9" fill="white" stroke="#adc8bb"/>
<text x="360" y="360" font-size="21">Loss: только 12 скрытых patches</text>
<text x="360" y="392" font-size="17">Сравниваем предсказанные пиксели с целью.</text>
<text x="30" y="460" font-size="18">Позиции восстанавливают исходную сетку; reconstruction decoder нужен при предобучении.</text>
</g></svg>