<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="t d"><title id="t">MAE: encoder видит только оставленные patches</title><desc id="d">Учебная сетка 4 × 4: 4 видимых patches, 12 скрытых. Серые клетки не передаются в encoder.</desc><rect width="900" height="490" fill="#f5f8f5" rx="16"/><g font-family="Segoe UI,sans-serif" fill="#213244">
<text x="30" y="40" font-size="24" font-weight="600">MAE: encoder видит только оставленные patches</text>
<rect x="45" y="105" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="58" y="137" font-size="18">1</text>
<rect x="100" y="105" width="51" height="51" rx="3" fill="#bee3d5"/>
<text x="113" y="137" font-size="18">2</text>
<rect x="155" y="105" width="51" height="51" rx="3" fill="#dce2e4"/>
<text x="168" y="137" font-size="18">3</text>
