<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">LoRA: поправка рядом с основной проекцией</title><desc id="desc">Вход x расходится к фиксированной W0 и обучаемым A/B; обе ветви сходятся в сумме ширины dout. Обратный сигнал по входу проходит через оба пути.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">LoRA: поправка рядом с основной проекцией</tspan></text>
<rect x="40" y="290" width="220" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">x [dᵢₙ]</tspan><tspan x="54" dy="24">Состояние позиции</tspan></text>
<rect x="370" y="100" width="340" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="384" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="384" dy="0">W₀ [dₒᵤₜ,dᵢₙ]</tspan><tspan x="384" dy="24">Фиксированные веса</tspan></text>
<rect x="370" y="400" width="280" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="384" y="427" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="384" dy="0">A [r,dᵢₙ]</tspan><tspan x="384" dy="24">h=Ax [r]</tspan></text>
<rect x="760" y="400" width="310" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="774" y="427" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="774" dy="0">B [dₒᵤₜ,r] → ×s</tspan><tspan x="774" dy="24">sBh [dₒᵤₜ]</tspan></text>
<rect x="760" y="100" width="310" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="774" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="774" dy="0">Сумма W₀x + sBAx</tspan><tspan x="774" dy="24">y [dₒᵤₜ]</tspan></text>
<path d="M260,330 L300,330 L300,145 L370,145" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M260,330 L300,330 L300,442 L370,442" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M650,442 L760,442" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M710,145 L760,145" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M915,400 L915,190" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="600" width="1030" height="105" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="627" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">B=0: ∇A=0; ∇B=s·g·(Ax)ᵀ может быть ненулевым.</tspan><tspan x="54" dy="24">После первого шага B≠0 открывает путь к A. Обе нулевые матрицы не стартуют обычным task-gradient.</tspan><tspan x="54" dy="24">Градиент входа: W₀ᵀg + sAᵀBᵀg; заморозка W₀ не удаляет её путь.</tspan></text></svg>
