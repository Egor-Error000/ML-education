<text x="794" y="577" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="794" dy="0">Tokenizer, шаблон и адаптер</tspan><tspan x="794" dy="24">входят в комплект</tspan></text>
<path d="M930.0,510 L930.0,550" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,170 L560,225 L930.0,225 L930.0,290" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">70%→80% на 100 задачах не доказывает точное преимущество: SE≈0.053852. Ничьи 45/35/20: 55% или 56.25%.</tspan></text></svg>
