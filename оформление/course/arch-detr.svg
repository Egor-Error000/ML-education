<title id="title">DETR: set prediction</title><desc id="desc">Запросы читают признаки изображения через decoder. Hungarian matching назначает предсказания targets для loss; это не NMS по попарному IoU. Число queries и no-object convention входят в конкретную реализацию.</desc>
