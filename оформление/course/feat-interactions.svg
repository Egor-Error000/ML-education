<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">Взаимодействия: отдельная пара, FM и FFM</title><desc id="desc">Ручной cross хранит отдельный эффект пары. FM делит факторы между парами; в FFM фактор зависит ещё и от поля партнёра.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="790" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Взаимодействия: отдельная пара, FM и FFM</tspan></text>
<rect x="295" y="55" width="530" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="309" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="309" dy="0">Поля: город A, день D, товар P</tspan></text>
<rect x="25" y="225" width="310" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="39" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="39" dy="0">Ручной cross</tspan></text>
<rect x="25" y="365" width="310" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="39" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="39" dy="0">Ключи (A,D), (A,P), (D,P)</tspan><tspan x="39" dy="23">Каждой паре свой вес</tspan></text>
<path d="M560,125 L560,175 L180,175 L180,225" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180,300 L180,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="225" width="310" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="419" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="419" dy="0">FM</tspan></text>
<rect x="405" y="365" width="310" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="419" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="419" dy="0">Один вектор города eA</tspan><tspan x="419" dy="23">Для A–D и A–P общий</tspan></text>
<path d="M560,125 L560,175 L560,175 L560,225" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,300 L560,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="785" y="225" width="310" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">FFM</tspan></text>
<rect x="785" y="365" width="310" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="799" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="799" dy="0">Вектор города зависит от поля</tspan><tspan x="799" dy="23">eA,day и eA,product</tspan></text>
<path d="M560,125 L560,175 L940,175 L940,225" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M940,300 L940,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="165" y="555" width="790" height="100" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="179" y="582" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="179" dy="0">Новая пара из известных категорий: FM может вычислить произведение.</tspan><tspan x="179" dy="24">Новый ID без данных требует явного резервного поведения.</tspan></text></svg>
