<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc"><title id="title">Путь примера к ошибке и возобновление потока</title><desc id="desc">Sampler выбирает ID, dataset получает пример, collate формирует пакет с масками; состояние продолжения учитывает фактически обработанные данные.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="780" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Путь примера к ошибке и возобновление потока</tspan></text>
<rect x="250" y="70" width="620" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="264" y="97" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="264" dy="0">Манифест: объекты, метки, группы и версии</tspan></text>
<rect x="250" y="190" width="620" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="264" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="264" dy="0">Sampler / распределение по работникам → ID</tspan></text>
<rect x="250" y="310" width="620" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="264" y="337" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="264" dy="0">Dataset → вход, цель и метаданные</tspan></text>
<rect x="250" y="430" width="620" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="264" y="457" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="264" dy="0">Collate → пакет, заполнители и маски</tspan></text>
<rect x="250" y="550" width="620" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="264" y="577" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="264" dy="0">Модель → цели и нормированная ошибка</tspan></text>
<path d="M560,145 L560,190" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,265 L560,310" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,385 L560,430" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,505 L560,550" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="720" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Checkpoint: обработанная позиция, RNG, оптимизатор и порядок; очередь prefetch не равна выполненным шагам.</tspan></text></svg>
