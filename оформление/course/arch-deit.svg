<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">DeiT: label и teacher supervision</title><desc id="desc">Обе головы читают отдельные token states одного encoder. Ground-truth class и teacher signal задают разные слагаемые loss. Teacher prediction не заменяет истинную разметку; правило применения голов на inference фиксируется recipe.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="680" rx="16" fill="#f5f8f5"/>
<text x="28" y="36" font-family="Segoe UI,sans-serif" font-size="22" fill="#173644">DeiT: label и teacher supervision</text>
<path d="M290,136 L365,136" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625,136 L700,136" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830,182 L830,300" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830.0" y="233.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">CLS state</text>
<path d="M700,136 L625,346" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662.5" y="233.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">distill state</text>
<path d="M160,182 L160,300" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M290,346 L365,556" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="327.5" y="443.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">teacher signal</text>
<path d="M495,392 L495,510" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,346 L625,556" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M290,556 L365,556" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="327.5" y="548.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">label</text>
<rect x="30" y="90" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="136.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">image / patches</text>
<rect x="365" y="90" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="136.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">patch + CLS + distill tokens</text>
<rect x="700" y="90" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="136.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">Transformer encoder</text>
<rect x="30" y="300" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="160" y="346.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">teacher → target signal</text>
<rect x="365" y="300" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="346.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">distillation head</text>
<rect x="700" y="300" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="346.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">classification head</text>
<rect x="30" y="510" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="556.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">ground-truth class</text>
<rect x="365" y="510" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="495" y="556.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">class loss + distill loss</text>
<text x="28" y="660" font-family="Segoe UI,sans-serif" font-size="13" fill="#526b75">Зелёный: модель / преобразование; серый: вход, состояние или результат. Пунктир: обход / управление.</text></svg>