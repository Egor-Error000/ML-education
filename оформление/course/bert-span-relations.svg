<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">Вложенные сущности и отношения требуют других выходов</title><desc id="desc">Одна BIO-метка на позицию не кодирует все вложенные интервалы. Сначала выбирают интервалы, затем упорядоченные пары для отношений.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="740" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Вложенные сущности и отношения требуют других выходов</tspan></text>
<rect x="40" y="85" width="1030" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="54" dy="0">Токены:  [Нью]₁ [Йоркский]₂ [университет]₃</tspan><tspan x="54" dy="25">Сущности: [1,2] — место; [1,3] — организация</tspan></text>
<rect x="40" y="240" width="460" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="267" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Encoder → H [B,L,D]</tspan></text>
<rect x="40" y="365" width="460" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Кандидаты [start,end]</tspan><tspan x="54" dy="24">Границы, ширина, состояния внутри</tspan></text>
<path d="M270.0,325 L270.0,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="490" width="460" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Голова сущностей → класс / нет сущности</tspan><tspan x="54" dy="24">При L=5: 15 интервалов; ширина ≤2: 9</tspan></text>
<path d="M270.0,450 L270.0,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="365" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Отобранные интервалы</tspan><tspan x="664" dy="24">Пропущенная сущность не попадёт в связь</tspan></text>
<rect x="650" y="490" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Пары (источник, получатель)</tspan><tspan x="664" dy="24">Голова отношений и направление роли</tspan></text>
<path d="M860.0,450 L860.0,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500,532 L575,532 L575,407 L650,407" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="685" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Перестановка аргументов меняет смысл связи. Отрицание и кореференция требуют своей разметки и проверки.</tspan></text></svg>
