<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">Масштабирование с задержкой: backlog не исчезает при создании pod</title><desc id="desc">Постоянный приход 3/с, старая capacity 2/с. Через 40 секунд готова независимая новая 2/с; очередь затем убывает 1/с.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="670" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Масштабирование с задержкой: backlog не исчезает при создании pod</tspan></text>
<path d="M90,480 L1030,480 M90,480 L90,100" fill="none" stroke="#7990a6" stroke-width="2"/>
<path d="M100,480 L560,160 L1020,480" fill="none" stroke="#286b87" stroke-width="4"/>
<text x="80" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="80" dy="0">0 s</tspan></text>
<text x="540" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="540" dy="0">40 s</tspan></text>
<text x="1000" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="1000" dy="0">80 s</tspan></text>
<text x="40" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="40" dy="0">40</tspan></text>
<text x="100" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#173644"><tspan x="100" dy="0">Число ожидающих в условной fluid-модели</tspan></text>
<text x="240" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="240" dy="0">Приход 3/с</tspan><tspan x="240" dy="25">Capacity 2/с</tspan><tspan x="240" dy="25">Рост +1/с</tspan></text>
<text x="690" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="690" dy="0">Приход 3/с</tspan><tspan x="690" dy="25">Capacity 4/с</tspan><tspan x="690" dy="25">Убывание −1/с</tspan></text>
<text x="35" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">40 s запуска дают около 40 запросов backlog. Нужны ещё около 40 s, чтобы его погасить при заданных rates.</tspan></text></svg>
