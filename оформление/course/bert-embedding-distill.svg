<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">Дистилляция векторов: согласовать пространство и задачу</title><desc id="desc">Учитель заморожен; меньший ученик обучается. Проекция согласует размеры, но даже общий размер не гарантирует полезную геометрию.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="720" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Дистилляция векторов: согласовать пространство и задачу</tspan></text>
<rect x="40" y="90" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Текст → замороженный учитель</tspan></text>
<rect x="40" y="215" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Вектор t [768]</tspan><tspan x="54" dy="24">Нет градиента в учителя</tspan></text>
<path d="M250.0,175 L250.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="90" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Текст → обучаемый ученик</tspan></text>
<rect x="650" y="215" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Вектор s [256]</tspan><tspan x="664" dy="24">Градиент в encoder ученика</tspan></text>
<path d="M860.0,175 L860.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="370" width="420" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Проекция P [256,768]</tspan><tspan x="54" dy="24">Сопоставить Pt и s или сравнить scores</tspan></text>
<path d="M250,300 L250,370" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="370" width="420" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Loss соответствия + проверка retrieval</tspan><tspan x="664" dy="24">Подходящая цель удерживает различия</tspan></text>
<path d="M860,300 L860,370" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460,415 L650,415" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="560" width="1030" height="105" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="587" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Если P и s свободно обучаются только на ||Pt−s||², P=0 и s=0 дают вырождение.</tspan><tspan x="54" dy="24">Фиксированное соответствие, обучение оценок и независимая оценка решают разные части задачи.</tspan><tspan x="54" dy="24">1 млн float32-векторов: 768 → 3.072 GB; 256 → 1.024 GB, без служебных данных.</tspan></text></svg>
