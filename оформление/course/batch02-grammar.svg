<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Грамматика: состояние → допустимые токены → новое состояние</title><desc id="desc">Модель даёт логиты; анализатор проверяет весь токен. Остановка допустима лишь в принимающем состоянии, если не произошло внешнее усечение.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Грамматика: состояние → допустимые токены → новое состояние</tspan></text>
<rect x="40" y="100" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Состояние parser для текущего префикса</tspan></text>
<rect x="40" y="230" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Проверить все bytes каждого token</tspan><tspan x="54" dy="24">Маска допустимых продолжений</tspan></text>
<path d="M275.0,190 L275.0,230" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Логиты → маска → нормировка → выбор</tspan></text>
<path d="M275.0,320 L275.0,360" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="490" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Обновить parser; accepting? → EOS</tspan></text>
<path d="M275.0,450 L275.0,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="180" width="390" height="150" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="694" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="694" dy="0">p=(.97,.02,.01); разрешены B,C.</tspan><tspan x="694" dy="24">После маски: (0,2/3,1/3).</tspan><tspan x="694" dy="24">Nucleus .9 сохраняет оба.</tspan><tspan x="694" dy="24">Пустое множество → явная ошибка.</tspan></text>
<path d="M510,535 L610,535 L610,65 L275,65 L275,100" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="720" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="35" dy="0">Локально валидные префиксы не гарантируют завершения, истинности полей или глобального conditioning на валидность.</tspan></text></svg>
