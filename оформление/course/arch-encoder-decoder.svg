<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Encoder–decoder: источник Q и K/V</title><desc id="desc">Encoder читает источник, decoder не получает будущие target tokens; cross-attention связывает две разные длины.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="680" rx="16" fill="#f5f8f5"/>
<text x="28" y="36" font-family="Segoe UI,sans-serif" font-size="22" fill="#173644">Encoder–decoder: источник Q и K/V</text>
<path d="M290,136 L365,136" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M290,366 L365,366" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625,366 L700,366" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662.5" y="358.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">Q из decoder</text>
<path d="M625,136 L700,366" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662.5" y="243.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">K/V из encoder</text>
<path d="M830,412 L830,510" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="90" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="160" y="136.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">source tokens → encoder</text>
<rect x="365" y="90" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="495" y="126.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">encoder states</text>
<text x="495" y="145.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">[B,S,D]</text>
<rect x="30" y="320" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="366.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">shifted target prefix</text>
<rect x="365" y="320" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="356.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">causal self-attention</text>
<text x="495" y="375.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">по target positions</text>
<rect x="700" y="320" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="356.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">cross-attention</text>
<text x="830" y="375.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">scores [B,H,T,S]</text>
<rect x="700" y="510" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="830" y="556.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">MLP / head → target logits</text>
<text x="28" y="660" font-family="Segoe UI,sans-serif" font-size="13" fill="#526b75">Зелёный: модель / преобразование; серый: вход, состояние или результат. Пунктир: обход / управление.</text></svg>