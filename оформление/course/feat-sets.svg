<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">A, B, A: присутствие, кратность и порядок</title><desc id="desc">Преобразования имеют разные выходы. Симметричная сумма векторов не восстанавливает порядок.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="720" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">A, B, A: присутствие, кратность и порядок</tspan></text>
<rect x="315" y="70" width="490" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="329" y="97" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="329" dy="0">Входной список: [A, B, A]</tspan></text>
<rect x="25" y="245" width="310" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="39" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="39" dy="0">Множество: удалить повторы</tspan></text>
<rect x="25" y="385" width="310" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="39" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="39" dy="0">Multi-hot: (1,1,0)</tspan></text>
<path d="M560,140 L560,190 L180,190 L180,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180,330 L180,385" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="245" width="310" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="419" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="419" dy="0">Мультимножество</tspan></text>
<rect x="405" y="385" width="310" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="419" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="419" dy="0">Количество: (2,1,0)</tspan></text>
<path d="M560,140 L560,190 L560,190 L560,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,330 L560,385" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="785" y="245" width="310" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="799" dy="0">Последовательность</tspan></text>
<rect x="785" y="385" width="310" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="799" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="799" dy="0">Порядок: A → B → A</tspan></text>
<path d="M560,140 L560,190 L940,190 L940,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M940,330 L940,385" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">eA=(1,0), eB=(0,2): сумма=(2,2), среднее=(2/3,2/3), максимум=(1,2).</tspan></text>
<text x="35" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Пустой список, отсутствие поля и PAD обрабатываются по явному контракту.</tspan></text></svg>
