<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc"><title id="title">Метрики кластеризации: два разных вопроса оценки</title><desc id="desc">Одно разбиение сравнивается либо с независимой разметкой, либо с геометрией признаков. Обе ветви сопровождаются отчётом о шуме, охвате и независимости выбора.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="850" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Метрики кластеризации: два разных вопроса оценки</tspan></text>
<rect x="365" y="90" width="390" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="379" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="379" dy="0">Разбиение: ID группы каждого объекта</tspan><tspan x="379" dy="24">Номера условны; состав групп важен</tspan></text>
<rect x="35" y="270" width="320" height="90" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="49" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="49" dy="0">Независимые классы</tspan><tspan x="49" dy="23">Только для внешней оценки</tspan></text>
<rect x="765" y="270" width="320" height="90" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="779" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="779" dy="0">Координаты и расстояние</tspan><tspan x="779" dy="23">Выбранное пространство</tspan></text>
<rect x="35" y="485" width="470" height="110" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="512" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Внешняя оценка</tspan><tspan x="49" dy="24">Таблица n_kc → purity / ARI / NMI</tspan><tspan x="49" dy="24">Согласие с разметкой</tspan></text>
<rect x="635" y="485" width="450" height="110" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="649" y="512" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="649" dy="0">Внутренняя оценка</tspan><tspan x="649" dy="24">Расстояния и группы → DB / CH</tspan><tspan x="649" dy="24">Компактность выбранной геометрии</tspan></text>
<path d="M560,180 L560,420 L270,420 L270,485" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,420 L860,420 L860,485" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M195,360 L195,485" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M925,360 L925,485" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="705" width="1050" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="49" y="732" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Общий протокол: число объектов, доля охвата, обработка шума и независимость выбора</tspan><tspan x="49" dy="24">Не усреднять произвольно разные шкалы. Высокое значение на лёгком подмножестве не оценивает всё множество.</tspan></text>
<path d="M270,595 L270,705" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,595 L860,705" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
