<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">Паспорт прогноза: что известно к моменту решения</title><desc id="desc">Единица прогноза может отличаться от группы связанных наблюдений. Признаки ограничены их временем доступности, цель созревает позже.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="700" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Паспорт прогноза: что известно к моменту решения</tspan></text>
<rect x="45" y="85" width="460" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="59" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="59" dy="0">Единица: заказ; группа: пользователь</tspan><tspan x="59" dy="24">Источник: магазин и версия выгрузки</tspan></text>
<rect x="45" y="270" width="460" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="59" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="59" dy="0">Момент прогноза: подтверждение заказа</tspan><tspan x="59" dy="24">Вход: только доступные к нему поля</tspan></text>
<path d="M275,175 L275,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="85" width="430" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Метка: возврат за 30 дней</tspan><tspan x="664" dy="24">Положительный исход может прийти раньше</tspan></text>
<rect x="650" y="270" width="430" height="90" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="664" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Нет возврата + полное окно → 0</tspan><tspan x="664" dy="24">Окно не завершено → исход неизвестен</tspan></text>
<path d="M865,175 L865,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="490" width="640" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="254" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="254" dy="0">Разбиение: какие новые объекты и даты?</tspan><tspan x="254" dy="24">Baseline, метрика, срезы и размер каждой группы</tspan></text>
<path d="M275,360 L275,445 L440,445 L440,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M865,360 L865,445 L680,445 L680,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
