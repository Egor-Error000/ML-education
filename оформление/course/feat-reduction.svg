<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">PCA: обучение базиса и применение к новой точке</title><desc id="desc">Обучающие точки определяют среднее и направление. Новая точка проецируется теми же параметрами; остаток теряется.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">PCA: обучение базиса и применение к новой точке</tspan></text>
<rect x="45" y="85" width="470" height="95" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="59" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="59" dy="0">Обучение: (1,1), (3,3)</tspan><tspan x="59" dy="24">среднее μ=(2,2)</tspan></text>
<rect x="45" y="260" width="470" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="59" y="287" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="59" dy="0">Центрировать → (−1,−1), (1,1)</tspan><tspan x="59" dy="24">v₁=(1,1)/√2; сохранить μ и v₁</tspan></text>
<path d="M280,180 L280,260" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="640" y="85" width="430" height="95" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="654" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="654" dy="0">Новая точка x=(5,1)</tspan><tspan x="654" dy="24">x−μ=(3,−1)</tspan></text>
<rect x="640" y="260" width="430" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="654" y="287" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="654" dy="0">Проекция z=(x−μ)·v₁=√2</tspan><tspan x="654" dy="24">Восстановление = (3,3)</tspan></text>
<path d="M855,180 L855,260" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M515,310 L640,310" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="505" width="660" height="100" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="244" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="244" dy="0">Остаток: (5,1)−(3,3)=(2,−2)</tspan><tspan x="244" dy="26">Квадрат ошибки 2²+(−2)²=8</tspan></text>
<path d="M855,355 L855,460 L560,460 L560,505" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
