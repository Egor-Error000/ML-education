<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 900" role="img" aria-labelledby="title desc"><title id="title">Семейства Transformer: три самостоятельных пути</title><desc id="desc">Кодировщик обрабатывает наблюдаемый вход; причинный декодер продолжает префикс; кодировщик-декодер разделяет источник и цель и связывает их перекрёстным вниманием.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1480" height="900" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Семейства Transformer: три самостоятельных пути</tspan></text>
<text x="35" y="95" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#173644"><tspan x="35" dy="0">Кодировщик</tspan></text>
<text x="510" y="95" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#173644"><tspan x="510" dy="0">Только декодер</tspan></text>
<text x="1000" y="95" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#173644"><tspan x="1000" dy="0">Кодировщик–декодер</tspan></text>
<rect x="35" y="145" width="390" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="172" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Наблюдаемый текст → IDs</tspan><tspan x="49" dy="24">Векторы + позиции [B,S,D]</tspan></text>
<rect x="35" y="300" width="390" height="145" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="49" dy="0">N encoder-блоков</tspan><tspan x="49" dy="23">Двунаправленное самовнимание</tspan><tspan x="49" dy="23">MLP, нормализация, residual</tspan></text>
<path d="M230,235 L230,300" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="530" width="390" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="49" y="557" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Состояния [B,S,D]</tspan><tspan x="49" dy="24">Голова класса / меток / MLM</tspan></text>
<path d="M230,445 L230,530" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="35" dy="0">Слева и справа доступны</tspan><tspan x="35" dy="25">переданные позиции.</tspan><tspan x="35" dy="25">Выход относится к входу.</tspan></text>
<rect x="510" y="145" width="390" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="524" y="172" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="524" dy="0">Префикс → IDs</tspan><tspan x="524" dy="24">Векторы + позиции [B,T,D]</tspan></text>
<rect x="510" y="300" width="390" height="145" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="524" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="524" dy="0">N decoder-блоков</tspan><tspan x="524" dy="23">Причинное самовнимание</tspan><tspan x="524" dy="23">MLP, нормализация, residual</tspan></text>
<path d="M705,235 L705,300" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="510" y="530" width="390" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="524" y="557" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="524" dy="0">Последнее состояние → LM head</tspan><tspan x="524" dy="23">Оценки словаря → следующий ID</tspan></text>
<path d="M705,445 L705,530" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="510" dy="0">Будущие позиции закрыты.</tspan><tspan x="510" dy="25">Новый ID дополняет префикс</tspan><tspan x="510" dy="25">в следующем шаге генерации.</tspan></text>
<rect x="1000" y="145" width="190" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="1014" y="172" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="1014" dy="0">Источник</tspan><tspan x="1014" dy="23">[B,S,D]</tspan></text>
<rect x="1240" y="145" width="190" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="1254" y="172" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="1254" dy="0">Префикс цели</tspan><tspan x="1254" dy="23">[B,T,D]</tspan></text>
<rect x="1000" y="300" width="190" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="1014" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="1014" dy="0">Encoder</tspan><tspan x="1014" dy="23">Весь источник</tspan><tspan x="1014" dy="23">→ память K/V</tspan></text>
<rect x="1240" y="300" width="190" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="1254" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="1254" dy="0">Decoder</tspan><tspan x="1254" dy="23">Причинное</tspan><tspan x="1254" dy="23">самовнимание → Q</tspan></text>
<path d="M1095,235 L1095,300" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1335,235 L1335,300" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1000" y="490" width="430" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="1014" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="1014" dy="0">Перекрёстное внимание</tspan><tspan x="1014" dy="24">Q цели × K/V источника</tspan><tspan x="1014" dy="24">Веса [B,H,T,S]</tspan></text>
<path d="M1095,400 L1095,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1335,400 L1335,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1000" y="675" width="430" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="1014" y="702" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="1014" dy="0">Поток цели: MLP и residual</tspan><tspan x="1014" dy="24">Стек → LM head → следующий ID</tspan></text>
<path d="M1215,590 L1215,675" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="855" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="35" dy="0">Маски задают доступность информации. Цели и функция потерь задаются отдельно от выбора семейства.</tspan></text></svg>
