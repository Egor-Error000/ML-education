<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">ColBERT: позднее взаимодействие токенов</title><desc id="desc">Независимые encoder-проходы сохраняют векторы токенов. Для каждого токена запроса берут максимальное сходство с разрешённым токеном документа, затем суммируют.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">ColBERT: позднее взаимодействие токенов</tspan></text>
<rect x="40" y="90" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Запрос → Q [m,d]</tspan></text>
<rect x="650" y="90" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Документ → D [n,d]</tspan><tspan x="664" dy="24">Можно сохранить до запроса</tspan></text>
<rect x="340" y="270" width="450" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="354" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="354" dy="0">Матрица QDᵀ [m,n]</tspan><tspan x="354" dy="24">Padding документа исключён из max</tspan></text>
<path d="M250,175 L250,310 L340,310" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,175 L860,310 L790,310" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="450" width="470" height="155" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="54" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Q = ((1,0),(0,1))</tspan><tspan x="54" dy="24">Dₐ = ((1,0),(0,1),(−1,0))</tspan><tspan x="54" dy="24">QDₐᵀ = ((1,0,−1),(0,1,0))</tspan><tspan x="54" dy="24">max строк: (1,1) → сумма 2</tspan></text>
<rect x="650" y="450" width="420" height="155" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="664" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Dᵦ = ((0,1),(0,1),(0,−1))</tspan><tspan x="664" dy="24">QDᵦᵀ = ((0,0,0),(1,1,−1))</tspan><tspan x="664" dy="24">max строк: (0,1) → сумма 1</tspan><tspan x="664" dy="24">Оба средних D равны (0,1/3).</tspan></text>
<path d="M565,355 L565,400 L275,400 L275,450" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M565,400 L860,400 L860,450" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="35" dy="0">Один токен документа может быть максимумом для нескольких токенов запроса: это не взаимно однозначное сопоставление.</tspan></text></svg>
