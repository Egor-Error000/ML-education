<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Структурное удаление: одни и те же промежуточные координаты</title><desc id="desc">В gated MLP удаляемые строки up и gate должны совпадать с удаляемыми столбцами down. Внешняя residual-ширина D остаётся прежней.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Структурное удаление: одни и те же промежуточные координаты</tspan></text>
<rect x="40" y="110" width="200" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">x [D=4]</tspan></text>
<rect x="350" y="90" width="310" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="364" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="364" dy="0">Up [F,D]</tspan><tspan x="364" dy="24">Оставить строки S</tspan></text>
<rect x="350" y="320" width="310" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="364" y="347" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="364" dy="0">Gate [F,D] → нелинейность</tspan><tspan x="364" dy="24">Оставить те же строки S</tspan></text>
<rect x="780" y="220" width="290" height="110" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="794" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="794" dy="0">Произведение [F′=6]</tspan><tspan x="794" dy="24">Down [D,F′]</tspan><tspan x="794" dy="24">Оставить столбцы S</tspan></text>
<path d="M240,155 L295,155 L295,140 L350,140" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M295,155 L295,370 L350,370" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660,140 L925,140 L925,220" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M660,370 L925,370 L925,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="570" width="1030" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="54" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">D=4,F=10 → 120 весов трёх проекций. После F′=6 → 72.</tspan><tspan x="54" dy="24">Residual D=4 и число KV-голов не изменились; уменьшение MLP само не сжимает KV-cache.</tspan></text></svg>
