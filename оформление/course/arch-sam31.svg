<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">SAM 3.1: video concept tracking</title><desc id="desc">Мультиплексирование меняет организацию обработки объектов; сохранение identity и masks требует temporal state. Сообщённые автором FPS относятся к его hardware, числу объектов и implementation.</desc>
