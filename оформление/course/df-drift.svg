<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">Сдвиг входов и оценка качества — связанные проверки</title><desc id="desc">Мониторинг входов не видит изменения Y при прежнем X. Качество проверяют по доступным меткам и подходящим независимым единицам.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="740" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Сдвиг входов и оценка качества — связанные проверки</tspan></text>
<rect x="290" y="70" width="540" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="304" y="97" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="304" dy="0">Новый поток и зафиксированная модель</tspan></text>
<rect x="40" y="245" width="460" height="95" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Входы и источники доступны сразу</tspan><tspan x="54" dy="24">Состав режимов, пропуски, новые значения</tspan></text>
<rect x="650" y="245" width="430" height="95" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Метки поступают позже</tspan><tspan x="664" dy="24">Правила сбора и зрелые когорты</tspan></text>
<path d="M560,145 L560,185 L270,185 L270,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,185 L865,185 L865,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="405" width="460" height="90" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Сигнал изменения X</tspan><tspan x="54" dy="24">Гипотеза, не установленный ущерб</tspan></text>
<rect x="650" y="405" width="430" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Ошибка модели на общих объектах</tspan><tspan x="664" dy="24">Парная или групповая оценка</tspan></text>
<path d="M270,340 L270,405" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M865,340 L865,405" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Режимы ошибок .1/.4: смесь .8/.2 даёт .16; смесь .2/.8 даёт .34 при тех же условных ошибках.</tspan></text></svg>
