<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Paged KV: логический блок не равен физическому адресу</title><desc id="desc">Позиция 34 при блоке 16 находится в логическом блоке 2 со смещением 2; таблица направляет чтение в физический B7.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Paged KV: логический блок не равен физическому адресу</tspan></text>
<rect x="40" y="110" width="300" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Логические позиции 0…15</tspan></text>
<rect x="40" y="290" width="300" height="80" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Таблица: 0 → B1</tspan></text>
<rect x="40" y="470" width="300" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Физический B1</tspan><tspan x="54" dy="24">K/V всех нужных слоёв</tspan></text>
<path d="M190,190 L190,290" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M190,370 L190,470" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="110" width="300" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="404" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="404" dy="0">Логические позиции 16…31</tspan></text>
<rect x="390" y="290" width="300" height="80" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="404" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="404" dy="0">Таблица: 1 → B3</tspan></text>
<rect x="390" y="470" width="300" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="404" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="404" dy="0">Физический B3</tspan><tspan x="404" dy="24">K/V всех нужных слоёв</tspan></text>
<path d="M540,190 L540,290" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M540,370 L540,470" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740" y="110" width="300" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="754" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="754" dy="0">Логические позиции 32…47</tspan></text>
<rect x="740" y="290" width="300" height="80" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="754" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="754" dy="0">Таблица: 2 → B7</tspan></text>
<rect x="740" y="470" width="300" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="754" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="754" dy="0">Физический B7</tspan><tspan x="754" dy="24">K/V всех нужных слоёв</tspan></text>
<path d="M890,190 L890,290" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M890,370 L890,470" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="635" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Четыре ветви по три блока, первые два общие: 12 без sharing, 2+4=6 со sharing.</tspan><tspan x="35" dy="24">Перед записью в общий частично заполненный блок нужен copy-on-write; refcount защищает читателей.</tspan></text></svg>
