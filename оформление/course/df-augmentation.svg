<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">Родитель, преобразование и согласованная метка</title><desc id="desc">Варианты одного источника сохраняют происхождение. Геометрическое изменение изображения переносится на рамку и проверяется по видимости.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="720" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Родитель, преобразование и согласованная метка</tspan></text>
<rect x="35" y="105" width="450" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Источник: 100×80</tspan><tspan x="49" dy="24">Рамка (10,20,40,60)</tspan></text>
<rect x="35" y="275" width="450" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="49" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Crop с началом (20,10), размер 50×50</tspan><tspan x="49" dy="24">Рамка после пересечения: (0,10,20,50)</tspan></text>
<path d="M260,195 L260,275" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="450" width="450" height="95" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="49" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Видимая площадь 800/1200 = 2/3</tspan><tspan x="49" dy="24">Правило порога выбирается заранее</tspan></text>
<path d="M260,375 L260,450" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="105" width="420" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">ID исходника и все его варианты</tspan><tspan x="664" dy="24">образуют семейство</tspan></text>
<rect x="650" y="275" width="420" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Групповое разбиение</tspan><tspan x="664" dy="24">Потомки не попадают в разные части</tspan></text>
<rect x="650" y="450" width="420" height="95" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="664" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Независимый реальный тест</tspan><tspan x="664" dy="24">и объявленный бюджет обучения</tspan></text>
<path d="M860,195 L860,275" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,375 L860,450" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
