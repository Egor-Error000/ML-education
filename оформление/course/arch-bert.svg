<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">BERT: encoder и головы задач</title><desc id="desc">Один encoder даёт контекстные состояния; MLM и supervised heads нормируются по разным альтернативам.</desc>
