<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 565" role="img" aria-labelledby="title desc"><title id="title">K-Means: два устойчивых разбиения одних точек</title><desc id="desc">Горизонтальные пары дают J=16, вертикальные J=4. В каждом случае кресты показывают средние групп, а линии — назначение точки центру.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="565" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">K-Means: два устойчивых разбиения одних точек</tspan></text>
<text x="85" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="85" dy="0">Горизонтальные пары</tspan></text>
<path d="M85,170 L85,420 L465,420" stroke="#aab8c8" fill="none"/>
<text x="81" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="81" dy="0">0</tspan></text>
<text x="169" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="169" dy="0">1</tspan></text>
<text x="257" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="257" dy="0">2</tspan></text>
<text x="345" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="345" dy="0">3</tspan></text>
<text x="433" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="433" dy="0">4</tspan></text>
<path d="M85,395 L261,395" stroke="#287b88" stroke-width="2" stroke-dasharray="5 4"/><circle cx="85" cy="395" r="8" fill="#287b88"/>
<text x="97" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="97" dy="0">A(0, 0)</tspan></text>
<path d="M85,219 L261,219" stroke="#ba6e37" stroke-width="2" stroke-dasharray="5 4"/><circle cx="85" cy="219" r="8" fill="#ba6e37"/>
<text x="97" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="97" dy="0">B(0, 2)</tspan></text>
<path d="M437,395 L261,395" stroke="#287b88" stroke-width="2" stroke-dasharray="5 4"/><circle cx="437" cy="395" r="8" fill="#287b88"/>
<text x="449" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="449" dy="0">C(4, 0)</tspan></text>
<path d="M437,219 L261,219" stroke="#ba6e37" stroke-width="2" stroke-dasharray="5 4"/><circle cx="437" cy="219" r="8" fill="#ba6e37"/>
<text x="449" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="449" dy="0">D(4, 2)</tspan></text>
<path d="M252,386 L270,404 M252,404 L270,386" stroke="#172d47" stroke-width="4"/>
<path d="M252,210 L270,228 M252,228 L270,210" stroke="#172d47" stroke-width="4"/>
<text x="195" y="495" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="195" dy="0">J = 16; кресты — центры</tspan></text>
<text x="630" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="630" dy="0">Вертикальные пары</tspan></text>
<path d="M630,170 L630,420 L1010,420" stroke="#aab8c8" fill="none"/>
<text x="626" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="626" dy="0">0</tspan></text>
<text x="714" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="714" dy="0">1</tspan></text>
<text x="802" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="802" dy="0">2</tspan></text>
<text x="890" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="890" dy="0">3</tspan></text>
<text x="978" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="978" dy="0">4</tspan></text>
<path d="M630,395 L630,307" stroke="#287b88" stroke-width="2" stroke-dasharray="5 4"/><circle cx="630" cy="395" r="8" fill="#287b88"/>
<text x="642" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="642" dy="0">A(0, 0)</tspan></text>
<path d="M630,219 L630,307" stroke="#287b88" stroke-width="2" stroke-dasharray="5 4"/><circle cx="630" cy="219" r="8" fill="#287b88"/>
<text x="642" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="642" dy="0">B(0, 2)</tspan></text>
<path d="M982,395 L982,307" stroke="#ba6e37" stroke-width="2" stroke-dasharray="5 4"/><circle cx="982" cy="395" r="8" fill="#ba6e37"/>
<text x="994" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="994" dy="0">C(4, 0)</tspan></text>
<path d="M982,219 L982,307" stroke="#ba6e37" stroke-width="2" stroke-dasharray="5 4"/><circle cx="982" cy="219" r="8" fill="#ba6e37"/>
<text x="994" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="994" dy="0">D(4, 2)</tspan></text>
<path d="M621,298 L639,316 M621,316 L639,298" stroke="#172d47" stroke-width="4"/>
<path d="M973,298 L991,316 M973,316 L991,298" stroke="#172d47" stroke-width="4"/>
<text x="740" y="495" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="740" dy="0">J = 4; кресты — центры</tspan></text>
<text x="30" y="545" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="30" dy="0">Координатные масштабы одинаковы. Убывание J внутри одного запуска не сравнивает его со всеми другими разбиениями.</tspan></text></svg>
