<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">DistilBERT: обучение ученика по трём сигналам</title><desc id="desc">Одинаковый изменённый текст поступает учителю и ученику. Выходы учителя фиксированы относительно обновления ученика. Ошибки языка, распределений и состояний обучают меньший стек; для применения учитель не нужен.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1280" height="900" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">DistilBERT: обучение ученика по трём сигналам</tspan></text>
<rect x="350" y="100" width="580" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="364" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="364" dy="0">Один изменённый текст [B,L]</tspan><tspan x="364" dy="27">Исходные MLM-цели сохранены</tspan></text>
<rect x="35" y="340" width="535" height="130" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="49" dy="0">Учитель BERT</tspan><tspan x="49" dy="25">12 блоков: attention + FFN + residual/LN</tspan><tspan x="49" dy="25">Состояния и распределения словаря</tspan><tspan x="49" dy="25">Фиксированный обучающий сигнал</tspan></text>
<rect x="710" y="340" width="535" height="130" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="724" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="724" dy="0">Ученик DistilBERT</tspan><tspan x="724" dy="25">6 блоков: attention + FFN + residual/LN</tspan><tspan x="724" dy="25">Меньше глубина; собственные параметры</tspan><tspan x="724" dy="25">Состояния и MLM-логиты</tspan></text>
<path d="M475,185 L475,265 L300,265 L300,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M805,185 L805,265 L975,265 L975,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="650" width="895" height="110" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="364" y="677" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="364" dy="0">Сумма сигналов: MLM + близость распределений + близость состояний</tspan><tspan x="364" dy="26">Обратный проход изменяет ученика</tspan><tspan x="364" dy="26">После обучения: текст → только ученик → прикладная голова</tspan></text>
<path d="M300,470 L300,705 L350,705" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M975,470 L975,650" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="850" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="35" dy="0">Удаление слоёв без обучения не воспроизводит этот процесс.</tspan></text></svg>
