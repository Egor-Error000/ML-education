<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">Integrated Gradients: путь от baseline до входа</title><desc id="desc">Интегральные градиенты усредняют производную вдоль заданного пути. Числовой пример показывает отличие от градиента только в конечной точке.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="700" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Integrated Gradients: путь от baseline до входа</tspan></text>
<rect x="40" y="90" width="420" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Baseline x′=(0,0)</tspan><tspan x="54" dy="24">Вход x=(2,3)</tspan><tspan x="54" dy="24">Функция F(x)=x₁x₂</tspan></text>
<rect x="650" y="90" width="420" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Прямой путь x(α)=(2α,3α)</tspan><tspan x="664" dy="24">∇F(x(α))=(3α,2α)</tspan><tspan x="664" dy="24">0 ≤ α ≤ 1</tspan></text>
<path d="M460,140 L650,140" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="330" width="420" height="130" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Только конечная точка</tspan><tspan x="54" dy="24">∇F(2,3)=(3,2)</tspan><tspan x="54" dy="24">x ⊙ ∇F = (6,6)</tspan><tspan x="54" dy="24">Сумма 12, хотя F(x)−F(x′)=6</tspan></text>
<rect x="650" y="330" width="420" height="130" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Интеграл по пути</tspan><tspan x="664" dy="24">IG₁=2 ∫₀¹3α dα=3</tspan><tspan x="664" dy="24">IG₂=3 ∫₀¹2α dα=3</tspan><tspan x="664" dy="24">Сумма 6 = изменение F</tspan></text>
<path d="M860,190 L860,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M250,190 L250,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">В тексте интегрируют по непрерывным embeddings, а не целым token IDs.</tspan><tspan x="35" dy="24">Baseline и путь — часть определения объяснения. Attribution не доказывает причинный смысл признака.</tspan></text></svg>
