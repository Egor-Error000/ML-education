<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">Prefill и decode: первый выбор ещё не новая строка KV</title><desc id="desc">Prefill строит K/V входа и даёт первый токен. Следующий проход обрабатывает этот выбранный ID и дописывает его K/V во всех слоях.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="790" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Prefill и decode: первый выбор ещё не новая строка KV</tspan></text>
<rect x="40" y="100" width="450" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Вход P токенов → prefill всех слоёв</tspan></text>
<rect x="40" y="230" width="450" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">K/V длины P каждого слоя + последние logits</tspan></text>
<path d="M265.0,190 L265.0,230" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="450" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Выбрать первый новый ID x₁</tspan></text>
<path d="M265.0,320 L265.0,360" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="360" width="420" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Обработать x₁ во всех слоях</tspan></text>
<rect x="650" y="490" width="420" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Добавить K/V x₁; длина P+1</tspan></text>
<path d="M860.0,450 L860.0,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="620" width="420" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="647" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Последние logits → выбрать x₂</tspan></text>
<path d="M860.0,580 L860.0,620" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M490,405 L650,405" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="100" width="420" height="130" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="664" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Каждый слой хранит свои K/V.</tspan><tspan x="664" dy="24">qₜ [1,d] читает K [t,d], V [t,d].</tspan><tspan x="664" dy="24">Прошлые Q обычно не нужны.</tspan><tspan x="664" dy="24">Чтение истории остаётся.</tspan></text>
<text x="35" y="755" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">В учебной scalar-head: (1,2) → 3.761594; добавление x=3 при сохранённых K/V → 5.895949.</tspan></text></svg>
