<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc"><title id="title">ELECTRA: две сети и два вида правильных ответов</title><desc id="desc">Генератор обучается восстанавливать исходные токены. Его дискретные предложения создают новый вход различителя. Различитель обучается отличать фактическое изменение ID от совпадения с оригиналом.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1280" height="1030" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">ELECTRA: две сети и два вида правильных ответов</tspan></text>
<rect x="35" y="100" width="510" height="100" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="49" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="49" dy="0">Исходные ID x [B,L]</tspan><tspan x="49" dy="27">Сохранить оригинал; выбрать позиции</tspan></text>
<rect x="735" y="100" width="510" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="749" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="749" dy="0">Замаскированный вход</tspan><tspan x="749" dy="27">Небольшой генератор + MLM-голова</tspan></text>
<path d="M545,150 L735,150" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="735" y="330" width="510" height="95" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="749" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="749" dy="0">Словарные вероятности выбранных мест</tspan><tspan x="749" dy="26">Случайный выбор дискретных ID</tspan></text>
<path d="M990,200 L990,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="330" width="510" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="49" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="49" dy="0">MLM-ошибка генератора</tspan><tspan x="49" dy="26">Правильный ответ — исходный ID</tspan></text>
<path d="M735,375 L545,375" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="735" y="565" width="510" height="110" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="749" y="592" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="749" dy="0">Подставить выбранные ID → x̃ [B,L]</tspan><tspan x="749" dy="26">Различитель: encoder + бинарная голова</tspan><tspan x="749" dy="26">По каждому допустимому месту</tspan></text>
<path d="M990,425 L990,565" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="565" width="510" height="110" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="49" y="592" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="49" dy="0">Метки RTD: r_t = 1[x̃_t ≠ x_t]</tspan><tspan x="49" dy="26">Случайное совпадение с x_t → метка 0</tspan><tspan x="49" dy="26">Остальные неизменённые позиции → 0</tspan></text>
<path d="M290,200 L290,260 L20,260 L20,615 L35,615" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M20,375 L35,375" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M735,610 L545,610" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="735" y="820" width="510" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="749" y="847" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="749" dy="0">Бинарная ошибка RTD</tspan><tspan x="749" dy="27">Обновить параметры различителя</tspan></text>
<path d="M990,675 L990,820" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M545,650 L640,650 L640,870 L735,870" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="990" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="35" dy="0">Дискретная подстановка не означает состязательное обучение генератора градиентом RTD.</tspan></text></svg>
