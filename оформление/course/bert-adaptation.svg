<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc"><title id="title">Адаптация: где возникает ошибка и какие веса меняются</title><desc id="desc">Разделение документов предшествует нарезке. Голова и encoder участвуют в прямом проходе, но набор обновляемых параметров выбирается отдельно.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="850" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Адаптация: где возникает ошибка и какие веса меняются</tspan></text>
<rect x="40" y="90" width="480" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Независимые документы → train / validation / test</tspan><tspan x="54" dy="24">Затем окна, пары и аугментации внутри части</tspan></text>
<rect x="40" y="215" width="480" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Токенизатор → IDs, attention mask</tspan><tspan x="54" dy="24">Encoder → H [B,L,D]</tspan></text>
<path d="M280.0,175 L280.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="340" width="480" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Голова: CLS → [B,C] или позиции → [B,L,C]</tspan><tspan x="54" dy="24">Смысл labels задаёт CE / BCE / регрессию</tspan></text>
<path d="M280.0,300 L280.0,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="465" width="480" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Loss(predictions, labels)</tspan><tspan x="54" dy="24">Backward → производные; optimizer → шаг</tspan></text>
<path d="M280.0,425 L280.0,465" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="690" y="330" width="380" height="105" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="704" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="704" dy="0">Разметка и маска loss</tspan><tspan x="704" dy="24">Неизвестная метка ≠ отрицательная</tspan><tspan x="704" dy="24">Padding ≠ цель обучения</tspan></text>
<path d="M690,382 L620,382 L620,507 L520,507" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="690" y="90" width="380" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="704" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="704" dy="0">Только голова</tspan><tspan x="704" dy="23">Encoder заморожен; dropout → eval</tspan></text>
<rect x="690" y="525" width="380" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="704" y="552" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="704" dy="0">Полное обучение</tspan><tspan x="704" dy="23">Градиенты головы и encoder</tspan></text>
<rect x="690" y="680" width="380" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="704" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="704" dy="0">Необязательная LoRA</tspan><tspan x="704" dy="23">Базовые веса фиксированы; A,B + голова</tspan></text>
<path d="M520,540 L595,540 L595,567 L690,567" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M520,540 L570,540 L570,722 L690,722" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M520,540 L550,540 L550,132 L690,132" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="760" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Накопление: последние микропакеты 16 + 16 + 8 = 40 объектов.</tspan><tspan x="35" dy="24">Для среднего по объектам веса ошибок равны 0.4, 0.4, 0.2; деление на 3 даёт другую цель.</tspan></text></svg>
