<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc"><title id="title">Привязка упоминания к базе знаний</title><desc id="desc">Сначала находят упоминание, затем извлекают кандидатов и ранжируют их в контексте. NIL означает отсутствие правильной сущности в базе.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="770" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Привязка упоминания к базе знаний</tspan></text>
<rect x="40" y="90" width="470" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Документ → границы упоминания</tspan><tspan x="54" dy="24">Контекст: «Пушкин жил…»</tspan></text>
<rect x="40" y="215" width="470" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Поиск кандидатов по базе</tspan><tspan x="54" dy="24">ID₁ поэт; ID₂ город; ID₃ иной объект</tspan></text>
<path d="M275.0,175 L275.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="340" width="470" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Контекст + кандидат → ранжирование</tspan><tspan x="54" dy="24">Не только совпадение написания</tspan></text>
<path d="M275.0,300 L275.0,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="465" width="470" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Выбрать ID либо NIL</tspan><tspan x="54" dy="24">NIL: правильного объекта нет в базе</tspan></text>
<path d="M275.0,425 L275.0,465" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="210" width="420" height="115" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="664" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">База знаний и её версия</tspan><tspan x="664" dy="24">ID, имена, описания, типы</tspan><tspan x="664" dy="24">Изменение базы меняет кандидатов</tspan></text>
<path d="M650,267 L510,267" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="430" width="420" height="150" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="457" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Две проверки</tspan><tspan x="664" dy="24">1. Gold-упоминания → качество linking.</tspan><tspan x="664" dy="24">2. Предсказанные границы → вся система.</tspan><tspan x="664" dy="24">Ошибка NER может лишить linker</tspan><tspan x="664" dy="24">правильного входа.</tspan></text>
<path d="M510,507 L650,507" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
