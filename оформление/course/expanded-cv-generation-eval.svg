<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 448" role="img" aria-labelledby="title desc">
<title id="title">Оценка генерации: fidelity, diversity, условия и FID</title><desc id="desc">Feature metric: Real images / generated images → Одинаковый feature extractor → Mean + covariance estimates → FID + protocol / sample count; Conditional evaluation: Фиксированные prompts / controls → Seeds + sampler + budget → Task checks + blind preference → Slices + uncertainty + failures</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416474"/></marker></defs>
<rect width="1120" height="448" rx="14" fill="#f6f8fb"/>
<text x="30" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#173b50">Оценка генерации: fidelity, diversity, условия и FID</text>
<text x="30" y="112" font-family="Arial,sans-serif" font-size="18" fill="#315a67">Feature metric</text>
<rect x="30" y="131" width="235" height="94" rx="9" fill="#dceafa" stroke="#718b9b"/>
<text x="147.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Real images / generated</text>
<text x="147.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">images</text>
<path d="M268,178 H296" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="131" width="235" height="94" rx="9" fill="#e1eee8" stroke="#718b9b"/>
<text x="422.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Одинаковый feature</text>
<text x="422.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">extractor</text>
<path d="M543,178 H571" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="580" y="131" width="235" height="94" rx="9" fill="#fff0d8" stroke="#718b9b"/>
<text x="697.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Mean + covariance</text>
<text x="697.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">estimates</text>
<path d="M818,178 H846" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="855" y="131" width="235" height="94" rx="9" fill="#ede5f7" stroke="#718b9b"/>
<text x="972.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">FID + protocol / sample</text>
<text x="972.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">count</text>
<text x="30" y="277" font-family="Arial,sans-serif" font-size="18" fill="#315a67">Conditional evaluation</text>
<rect x="30" y="296" width="235" height="94" rx="9" fill="#dceafa" stroke="#718b9b"/>
<text x="147.5" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Фиксированные prompts /</text>
<text x="147.5" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">controls</text>
<path d="M268,343 H296" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="296" width="235" height="94" rx="9" fill="#e1eee8" stroke="#718b9b"/>
<text x="422.5" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Seeds + sampler +</text>
<text x="422.5" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">budget</text>
<path d="M543,343 H571" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="580" y="296" width="235" height="94" rx="9" fill="#fff0d8" stroke="#718b9b"/>
<text x="697.5" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Task checks + blind</text>
<text x="697.5" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">preference</text>
<path d="M818,343 H846" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="855" y="296" width="235" height="94" rx="9" fill="#ede5f7" stroke="#718b9b"/>
<text x="972.5" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Slices + uncertainty +</text>
<text x="972.5" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">failures</text>
</svg>
