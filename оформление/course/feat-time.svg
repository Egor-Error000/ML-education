<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">Метка приходит после события: состояние признака меняется позже</title><desc id="desc">Заказы произошли в дни 1 и 2. Значения меток известны перед прогнозами дней 4 и 5; до этого исход не считается отрицательным.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="680" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Метка приходит после события: состояние признака меняется позже</tspan></text>
<text x="45" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="45" dy="0">День</tspan></text>
<rect x="190" y="80" width="130" height="65" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="204" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="204" dy="0">1</tspan></text>
<rect x="360" y="80" width="130" height="65" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="374" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="374" dy="0">2</tspan></text>
<rect x="530" y="80" width="130" height="65" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="544" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="544" dy="0">3</tspan></text>
<rect x="700" y="80" width="130" height="65" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="714" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="714" dy="0">4</tspan></text>
<rect x="870" y="80" width="130" height="65" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="884" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="884" dy="0">5</tspan></text>
<text x="45" y="220" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="45" dy="0">События</tspan></text>
<rect x="190" y="180" width="130" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="204" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="204" dy="0">Заказ 1</tspan></text>
<rect x="360" y="180" width="130" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="374" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="374" dy="0">Заказ 2</tspan></text>
<text x="45" y="370" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="45" dy="0">Метки</tspan></text>
<rect x="700" y="330" width="130" height="70" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="714" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="714" dy="0">y₁=1</tspan></text>
<rect x="870" y="330" width="130" height="70" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="884" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="884" dy="0">y₂=0</tspan></text>
<path d="M255,250 L255,285 L765,285 L765,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M425,250 L425,305 L935,305 L935,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="490" width="700" height="105" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="224" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="224" dy="0">До прогноза дня 3: 0.5</tspan><tspan x="224" dy="24">День 4: (1+2×0.5)/3 = 2/3</tspan><tspan x="224" dy="24">День 5: (1+0+2×0.5)/4 = 0.5</tspan></text></svg>
