<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Обычная генерация: повторное вычисление и остановка</title><desc id="desc">Фиксированные веса дают оценки; приложение выбирает токен, обновляет вход и проверяет причину остановки.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Обычная генерация: повторное вычисление и остановка</tspan></text>
<rect x="80" y="100" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="94" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="94" dy="0">Строка → tokenizer / template → IDs</tspan></text>
<rect x="80" y="230" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="94" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="94" dy="0">Forward по всей текущей последовательности</tspan></text>
<path d="M315.0,190 L315.0,230" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="360" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="94" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="94" dy="0">Логиты последней настоящей позиции</tspan></text>
<path d="M315.0,320 L315.0,360" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="490" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="94" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="94" dy="0">Выбрать ID → добавить → проверить EOS/лимит</tspan></text>
<path d="M315.0,450 L315.0,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720" y="300" width="350" height="110" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="734" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="734" dy="0">Конец?</tspan><tspan x="734" dy="24">Да → ответ + finish reason</tspan><tspan x="734" dy="24">Нет → следующий полный проход</tspan></text>
<path d="M550,535 L620,535 L620,355 L720,355" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1070,355 L1090,355 L1090,65 L315,65 L315,100" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="720" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="40" dy="0">Вход 4 и два новых токена: проходы длины 4 и 5. Веса не меняются; история и служебное состояние меняются.</tspan></text></svg>
