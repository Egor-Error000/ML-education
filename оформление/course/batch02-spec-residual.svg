<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">Speculative sampling: вернуть именно недостающую массу</title><desc id="desc">Принятые предложения дают min(p,q). Условная коррекция добавляет положительный остаток, не новое независимое распределение p.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="680" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Speculative sampling: вернуть именно недостающую массу</tspan></text>
<text x="35" y="165" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="35" dy="0">p</tspan></text>
<rect x="280" y="140" width="200.0" height="55" fill="#5795b8"/>
<text x="280" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="280" dy="0">A: 0.5</tspan></text>
<rect x="530" y="140" width="120.0" height="55" fill="#e1ad48"/>
<text x="530" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="530" dy="0">B: 0.3</tspan></text>
<rect x="780" y="140" width="80.0" height="55" fill="#80af86"/>
<text x="780" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="780" dy="0">C: 0.2</tspan></text>
<text x="35" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="35" dy="0">min(p,q)</tspan></text>
<rect x="280" y="280" width="200.0" height="55" fill="#5795b8"/>
<text x="280" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="280" dy="0">A: 0.5</tspan></text>
<rect x="530" y="280" width="40.0" height="55" fill="#e1ad48"/>
<text x="530" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="530" dy="0">B: 0.1</tspan></text>
<rect x="780" y="280" width="80.0" height="55" fill="#80af86"/>
<text x="780" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="780" dy="0">C: 0.2</tspan></text>
<text x="35" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="35" dy="0">недостаёт</tspan></text>
<rect x="280" y="420" width="0" height="55" fill="#5795b8"/>
<text x="280" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="280" dy="0">A: 0</tspan></text>
<rect x="530" y="420" width="80.0" height="55" fill="#e1ad48"/>
<text x="530" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="530" dy="0">B: 0.2</tspan></text>
<rect x="780" y="420" width="0" height="55" fill="#80af86"/>
<text x="780" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="780" dy="0">C: 0</tspan></text>
<text x="35" y="590" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">q=(.6,.1,.3), принятие=.8; residual=(0,1,0). Итог (.5,.1,.2)+(.0,.2,.0)=p.</tspan><tspan x="35" dy="24">Повторный независимый sample из p при reject дал бы (.6,.16,.24), другой закон.</tspan></text></svg>
