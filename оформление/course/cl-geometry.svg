<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">Кластеризация начинается с представления и расстояния</title><desc id="desc">Объекты превращаются в координаты, правило единиц и нормировки фиксируется отдельно, расстояние выбирает соседей, а смысл проверяется на исходных объектах.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="720" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Кластеризация начинается с представления и расстояния</tspan></text>
<rect x="35" y="95" width="470" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Объекты → признаки z</tspan><tspan x="49" dy="24">A=(0,0), B=(1,100), C=(10,0)</tspan></text>
<rect x="635" y="95" width="450" height="100" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="649" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="649" dy="0">Контракт единиц и преобразования</tspan><tspan x="649" dy="24">Вторую координату делить на 100?</tspan></text>
<rect x="35" y="315" width="470" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="342" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Сохранённое представление</tspan><tspan x="49" dy="24">Исходные координаты или B′=(1,1)</tspan></text>
<rect x="635" y="315" width="450" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="649" y="342" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="649" dy="0">Евклидовы расстояния от A</tspan><tspan x="649" dy="24">До B: 100.005 или √2; до C: 10</tspan></text>
<path d="M270,195 L270,315" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M635,145 L565,145 L565,270 L405,270 L405,315" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M505,365 L635,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="635" y="540" width="450" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="649" y="567" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="649" dy="0">Просмотр соседей в исходных объектах</tspan><tspan x="649" dy="23">Ближе C или B — полезно ли это задаче?</tspan></text>
<path d="M860,415 L860,540" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="565" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="35" dy="0">Алгоритм получает уже выбранную</tspan><tspan x="35" dy="25">геометрию. Единицы, масштаб и</tspan><tspan x="35" dy="25">мера близости — часть постановки.</tspan></text>
<text x="35" y="690" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Кластер отражает эту геометрию; совпадение с нужным смысловым классом проверяется отдельно.</tspan></text></svg>
