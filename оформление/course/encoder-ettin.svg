<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 970" role="img" aria-labelledby="title desc"><title id="title">Ettin: две самостоятельные модели в сопоставимом протоколе</title><desc id="desc">Согласованные данные и бюджеты поступают двум отдельным моделям. Кодировщик имеет двунаправленный контекст и MLM, декодер — причинный контекст и следующетокенную цель. Выходы сравниваются в прикладных задачах.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1280" height="970" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Ettin: две самостоятельные модели в сопоставимом протоколе</tspan></text>
<rect x="350" y="100" width="580" height="100" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="364" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="364" dy="0">Согласованные данные, порядок и бюджет</tspan><tspan x="364" dy="27">Зафиксировать размер и правила сравнения</tspan></text>
<rect x="35" y="350" width="535" height="110" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="49" dy="0">Кодировщик</tspan><tspan x="49" dy="25">Стек: внимание + MLP + residual/нормализация</tspan></text>
<rect x="35" y="545" width="535" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="572" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="49" dy="0">Двунаправленное внимание</tspan><tspan x="49" dy="27">Все разрешённые входные позиции</tspan></text>
<rect x="35" y="710" width="535" height="85" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="49" y="737" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="49" dy="0">Выбранные состояния → MLM</tspan><tspan x="49" dy="27">Цели исходных токенов</tspan></text>
<path d="M302,460 L302,545" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M302,630 L302,710" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="710" y="350" width="535" height="110" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="724" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="724" dy="0">Декодер</tspan><tspan x="724" dy="25">Стек: внимание + MLP + residual/нормализация</tspan></text>
<rect x="710" y="545" width="535" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="724" y="572" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="724" dy="0">Причинное внимание</tspan><tspan x="724" dy="27">Только доступный префикс</tspan></text>
<rect x="710" y="710" width="535" height="85" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="724" y="737" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="724" dy="0">Состояния → словарная голова</tspan><tspan x="724" dy="27">Цели следующего токена</tspan></text>
<path d="M977,460 L977,545" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M977,630 L977,710" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M475,200 L475,275 L300,275 L300,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M805,200 L805,275 L975,275 L975,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="900" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="35" dy="0">Два независимых выхода → общий протокол оценки. Нет передачи памяти из encoder в decoder.</tspan></text></svg>
