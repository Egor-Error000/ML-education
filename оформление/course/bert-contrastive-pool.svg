<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">Контрастивный пул: общий знаменатель не равен накоплению</title><desc id="desc">Сравнения между частями пакета возникают только при общем вычислении оценок или специальном обмене векторами. Накопление градиента само по себе их не создаёт.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="700" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Контрастивный пул: общий знаменатель не равен накоплению</tspan></text>
<text x="50" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="50" dy="0">Два микропакета по 2 пары</tspan></text>
<rect x="50" y="140" width="250" height="110" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="64" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="64" dy="0">Свой знаменатель</tspan><tspan x="64" dy="25">q₁,d₁</tspan><tspan x="64" dy="25">q₂,d₂</tspan></text>
<rect x="350" y="140" width="250" height="110" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="364" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="364" dy="0">Свой знаменатель</tspan><tspan x="364" dy="25">q₃,d₃</tspan><tspan x="364" dy="25">q₄,d₄</tspan></text>
<rect x="50" y="340" width="550" height="110" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="64" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="64" dy="0">Сложить градиенты → один шаг optimizer</tspan><tspan x="64" dy="24">У q₁ остаётся один чужой документ d₂.</tspan><tspan x="64" dy="24">Документы d₃,d₄ не участвовали в его loss.</tspan></text>
<path d="M175,250 L175,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M475,250 L475,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="680" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="680" dy="0">Общий пул 4×4</tspan></text>
