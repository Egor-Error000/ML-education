<text x="680" y="485" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="680" dy="0">Обычно: 1 positive + 3 negatives.</tspan><tspan x="680" dy="23">P₂: дополнительный верный документ;</tspan><tspan x="680" dy="23">считать его negative — ложная цель.</tspan></text>
<text x="35" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">При нескольких верных документах явно выбирают цель: вероятность множества или среднее по positives.</tspan><tspan x="35" dy="24">p=(0.5,0.3,0.2): −log(0.5+0.3)=0.2231; −[log 0.5+log 0.3]/2=0.9486.</tspan></text></svg>
