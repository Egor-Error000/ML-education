<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc"><title id="title">Плотный поиск: построение индекса и путь запроса</title><desc id="desc">Документы кодируют заранее. Запрос кодируется совместимой версией; индекс возвращает идентификаторы, после чего извлекают исходные тексты.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="780" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Плотный поиск: построение индекса и путь запроса</tspan></text>
<rect x="40" y="100" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Документы → допустимые фрагменты</tspan></text>
<rect x="40" y="225" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Encoder документов → векторы [N,d]</tspan></text>
<path d="M250.0,185 L250.0,225" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Построить индекс + ID + версии</tspan></text>
<path d="M250.0,310 L250.0,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="100" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Запрос → encoder запроса → q [d]</tspan></text>
<rect x="650" y="225" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Индекс + фильтры доступа → top-k IDs</tspan></text>
<path d="M860.0,185 L860.0,225" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="350" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Хранилище ID → тексты фрагментов</tspan></text>
<path d="M860.0,310 L860.0,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460,392 L560,392 L560,267 L650,267" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="560" width="420" height="110" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="587" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="664" dy="0">Дальше: reranker или reader</tspan><tspan x="664" dy="23">Reader получает тексты по своему интерфейсу;</tspan><tspan x="664" dy="23">вектор поиска не подменяет его состояния.</tspan></text>
<path d="M860,435 L860,560" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="715" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Контракт: encoder, tokenizer, pooling, нормировка, корпус, фильтры и параметры индекса.</tspan><tspan x="35" dy="24">Точное сравнение с тем же корпусом отделяет ошибку приближённого поиска от ошибки релевантности.</tspan></text></svg>
