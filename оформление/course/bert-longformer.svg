<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc"><title id="title">Longformer: локальные окна и глобальные позиции</title><desc id="desc">Локальная позиция взаимодействует с соседями, глобальная — со всем документом. Передача между удалёнными неглобальными позициями через глобальную требует двух слоёв.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="900" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Longformer: локальные окна и глобальные позиции</tspan></text>
<rect x="60" y="150" width="100" height="70" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="74" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="74" dy="0">G</tspan></text>
<rect x="195" y="150" width="100" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="209" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="209" dy="0">1</tspan></text>
<rect x="330" y="150" width="100" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="344" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="344" dy="0">2</tspan></text>
<rect x="465" y="150" width="100" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="479" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="479" dy="0">3</tspan></text>
<rect x="600" y="150" width="100" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="614" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="614" dy="0">4</tspan></text>
<rect x="735" y="150" width="100" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="749" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="749" dy="0">5</tspan></text>
<rect x="870" y="150" width="100" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="884" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="884" dy="0">6</tspan></text>
<rect x="1005" y="150" width="100" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="1019" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="1019" dy="0">7</tspan></text>
<text x="40" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="40" dy="0">Входные позиции: G — глобальная; 3 — пример локальной</tspan></text>
<path d="M245,220 L515,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M380,220 L515,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M515,220 L515,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M650,220 L515,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M785,220 L515,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="465" y="350" width="100" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="479" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="479" dy="0">h₃¹</tspan></text>
<text x="590" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="590" dy="0">Локальный радиус r=2:</tspan><tspan x="590" dy="24">источники 1…5 для позиции 3.</tspan><tspan x="590" dy="24">Отдельно доступна глобальная G.</tspan></text>
<path d="M110,220 L110,385 L465,385" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="500" width="1010" height="125" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="64" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="64" dy="0">Слой 1: удалённая позиция a → глобальное состояние G¹.</tspan><tspan x="64" dy="24">Слой 2: G¹ → удалённая позиция b.</tspan><tspan x="64" dy="24">При r=2 и трёх слоях только локальный путь имеет поле 1+2·2·3=13 позиций.</tspan><tspan x="64" dy="24">Разреженный attention уменьшает связи, но не отменяет стоимость FFN и проекций.</tspan></text>
<rect x="50" y="740" width="290" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="64" y="767" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="64" dy="0">Вход a⁰</tspan><tspan x="64" dy="24">Удалённая позиция</tspan></text>
<rect x="410" y="740" width="290" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="767" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Глобальное G¹</tspan><tspan x="424" dy="24">Слой 1 читает a⁰</tspan></text>
<rect x="780" y="740" width="290" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="794" y="767" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="794" dy="0">Состояние b²</tspan><tspan x="794" dy="24">Слой 2 читает G¹</tspan></text>
<path d="M340,785 L410,785" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,785 L780,785" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
