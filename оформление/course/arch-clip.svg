<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">CLIP: image и text ветви</title><desc id="desc">Два encoder независимо кодируют модальности. Pairwise scores сравнивают векторы одинаковой размерности; training objective выделяет правильные пары среди альтернатив batch. Этот граф не содержит region proposals или boxes, поэтому image-level CLIP не является готовым detector.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="680" rx="16" fill="#f5f8f5"/>
<text x="28" y="36" font-family="Segoe UI,sans-serif" font-size="22" fill="#173644">CLIP: image и text ветви</text>
<path d="M290,146 L365,146" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625,146 L700,146" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M290,366 L365,366" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625,366 L700,366" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830,192 L495,510" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662.5" y="343.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">dot / scale</text>
<path d="M700,366 L625,556" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662.5" y="453.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">dot / scale</text>
<rect x="30" y="100" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="146.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">image batch</text>
<rect x="365" y="100" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="146.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">image encoder</text>
<rect x="700" y="100" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="146.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">normalized image vectors</text>
<rect x="30" y="320" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="366.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">text batch</text>
<rect x="365" y="320" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="366.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">text encoder</text>
<rect x="700" y="320" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="366.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">normalized text vectors</text>
<rect x="365" y="510" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="546.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">pairwise similarity matrix</text>
<text x="495" y="565.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">contrastive loss / ranking</text>
<text x="28" y="660" font-family="Segoe UI,sans-serif" font-size="13" fill="#526b75">Зелёный: модель / преобразование; серый: вход, состояние или результат. Пунктир: обход / управление.</text></svg>