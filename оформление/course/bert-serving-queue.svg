<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc"><title id="title">Очередь и пакетирование: throughput не равен задержке запроса</title><desc id="desc">Все сто запросов приходят в нулевой момент. Один исполнитель обрабатывает десять пакетов по десять запросов за 0.2 секунды каждый.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="710" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Очередь и пакетирование: throughput не равен задержке запроса</tspan></text>
<rect x="40" y="90" width="230" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="54" dy="0">Обработчик</tspan><tspan x="54" dy="23">Поставить задание</tspan><tspan x="54" dy="23">Ждать результат</tspan></text>
<rect x="310" y="90" width="230" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="324" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="324" dy="0">Очередь</tspan><tspan x="324" dy="23">Хранить ожидающие</tspan><tspan x="324" dy="23">Пакет до 10</tspan></text>
<rect x="580" y="90" width="230" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="594" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="594" dy="0">Исполнитель</tspan><tspan x="594" dy="23">Извлечь пакет</tspan><tspan x="594" dy="23">Выполнить за 0.2 s</tspan></text>
<rect x="850" y="90" width="230" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="864" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="864" dy="0">Результат / ошибка</tspan><tspan x="864" dy="23">Вернуть обработчику</tspan><tspan x="864" dy="23">Завершить запрос</tspan></text>
<path d="M270,140 L310,140" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M540,140 L580,140" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M810,140 L850,140" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="245" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="40" dy="0">100 запросов в t=0. Завершения пакетов: 0.2, 0.4, …, 2.0 s.</tspan></text>
<rect x="40" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="54" dy="0">1</tspan><tspan x="54" dy="23">0.2 s</tspan></text>
<path d="M135,365 L143,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="143" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="157" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="157" dy="0">2</tspan><tspan x="157" dy="23">0.4 s</tspan></text>
<path d="M238,365 L246,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="246" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="260" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="260" dy="0">3</tspan><tspan x="260" dy="23">0.6 s</tspan></text>
<path d="M341,365 L349,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="349" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="363" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="363" dy="0">4</tspan><tspan x="363" dy="23">0.8 s</tspan></text>
<path d="M444,365 L452,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="452" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="466" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="466" dy="0">5</tspan><tspan x="466" dy="23">1.0 s</tspan></text>
<path d="M547,365 L555,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="555" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="569" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="569" dy="0">6</tspan><tspan x="569" dy="23">1.2 s</tspan></text>
<path d="M650,365 L658,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="658" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="672" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="672" dy="0">7</tspan><tspan x="672" dy="23">1.4 s</tspan></text>
<path d="M753,365 L761,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="761" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="775" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="775" dy="0">8</tspan><tspan x="775" dy="23">1.6 s</tspan></text>
<path d="M856,365 L864,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="864" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="878" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="878" dy="0">9</tspan><tspan x="878" dy="23">1.8 s</tspan></text>
<path d="M959,365 L967,365" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="967" y="330" width="95" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="981" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="981" dy="0">10</tspan><tspan x="981" dy="23">2.0 s</tspan></text>
<text x="40" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="40" dy="0">Порядок обработки пакетов → время завершения</tspan></text>
<rect x="40" y="500" width="1030" height="130" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="54" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Пропускная способность = 100 / 2 = 50 запросов/с.</tspan><tspan x="54" dy="24">Средняя задержка от прихода = (0.2+0.4+…+2.0)/10 = 1.1 s.</tspan><tspan x="54" dy="24">0.2 s — обслуживание одного пакета; 0.02 s — амортизированное время на запрос.</tspan><tspan x="54" dy="24">Ни одно из этих двух чисел не является средней задержкой ожидающих запросов.</tspan></text></svg>
