<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 448" role="img" aria-labelledby="title desc">
<title id="title">3D Gaussian Splatting: проекция, compositing и densification</title><desc id="desc">3DGS optimization: SfM points + camera poses → Means / scales / rotations / SH → Differentiable splat renderer → Photo loss → densify / prune; Rendering: 3D Gaussians + new camera → Project covariance → 2D ellipse → Tile binning + depth ordering → Alpha compositing → RGB</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416474"/></marker></defs>
<rect width="1120" height="448" rx="14" fill="#f6f8fb"/>
<text x="30" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#173b50">3D Gaussian Splatting: проекция, compositing и densification</text>
<text x="30" y="112" font-family="Arial,sans-serif" font-size="18" fill="#315a67">3DGS optimization</text>
<rect x="30" y="131" width="235" height="94" rx="9" fill="#dceafa" stroke="#718b9b"/>
<text x="147.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">SfM points + camera</text>
<text x="147.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">poses</text>
<path d="M268,178 H296" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="131" width="235" height="94" rx="9" fill="#e1eee8" stroke="#718b9b"/>
<text x="422.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Means / scales /</text>
<text x="422.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">rotations / SH</text>
<path d="M543,178 H571" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="580" y="131" width="235" height="94" rx="9" fill="#fff0d8" stroke="#718b9b"/>
<text x="697.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Differentiable splat</text>
<text x="697.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">renderer</text>
<path d="M818,178 H846" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="855" y="131" width="235" height="94" rx="9" fill="#ede5f7" stroke="#718b9b"/>
<text x="972.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Photo loss → densify /</text>
<text x="972.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">prune</text>
<text x="30" y="277" font-family="Arial,sans-serif" font-size="18" fill="#315a67">Rendering</text>
<rect x="30" y="296" width="235" height="94" rx="9" fill="#dceafa" stroke="#718b9b"/>
<text x="147.5" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">3D Gaussians + new</text>
<text x="147.5" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">camera</text>
<path d="M268,343 H296" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="296" width="235" height="94" rx="9" fill="#e1eee8" stroke="#718b9b"/>
<text x="422.5" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Project covariance → 2D</text>
<text x="422.5" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">ellipse</text>
<path d="M543,343 H571" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="580" y="296" width="235" height="94" rx="9" fill="#fff0d8" stroke="#718b9b"/>
<text x="697.5" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Tile binning + depth</text>
<text x="697.5" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">ordering</text>
<path d="M818,343 H846" stroke="#416474" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="855" y="296" width="235" height="94" rx="9" fill="#ede5f7" stroke="#718b9b"/>
