<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc"><title id="title">Исходный BERT: общие состояния, разные цели</title><desc id="desc">Изменённая пара сегментов обрабатывается одним двунаправленным стеком. Выбранные состояния предсказывают исходные токены, CLS через pooler предсказывает связь сегментов. Метки и знаменатели у голов различны.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1280" height="980" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Исходный BERT: общие состояния, разные цели</tspan></text>
<rect x="35" y="100" width="550" height="95" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="49" dy="0">Вход [B,L]: [CLS] A [SEP] B [SEP]</tspan><tspan x="49" dy="26">Изменённые ID; маска доступного контекста</tspan></text>
<rect x="735" y="100" width="510" height="95" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="749" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="749" dy="0">Сохранённые цели</tspan><tspan x="749" dy="26">Исходные токены + бинарная связь A/B</tspan></text>
<rect x="35" y="285" width="550" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="49" dy="0">Сумма token / position / segment</tspan><tspan x="49" dy="26">Стек двунаправленных блоков → H [B,L,D]</tspan></text>
<path d="M310,195 L310,285" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="505" width="550" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="49" dy="0">Выбранные H[I] [M,D]</tspan><tspan x="49" dy="25">Dense → GELU → LayerNorm → словарь [M,V]</tspan><tspan x="49" dy="25">MLM: среднее по выбранным целям</tspan></text>
<rect x="735" y="505" width="510" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="749" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="749" dy="0">H_CLS [B,D] → Dense + tanh</tspan><tspan x="749" dy="25">Бинарная голова [B,2]</tspan><tspan x="749" dy="25">NSP: среднее по примерам</tspan></text>
<path d="M310,385 L310,505" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M585,335 L660,335 L660,455 L990,455 L990,505" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M735,147 L690,147 L690,440 L35,440 L35,565" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M990,195 L990,505" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="780" width="895" height="110" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="364" y="807" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="364" dy="0">Взвешенная сумма двух ошибок → обратный проход → оптимизатор</tspan><tspan x="364" dy="25">Общий стек получает оба сигнала; головы имеют собственные параметры</tspan><tspan x="364" dy="25">Входные ID и метки не являются изменяемыми параметрами</tspan></text>
<path d="M310,625 L310,835 L350,835" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M990,625 L990,780" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="950" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="35" dy="0">Маска внимания, позиции MLM и метка NSP задают разные части вычисления.</tspan></text></svg>
