<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">mmBERT: расписание языков и одна общая модель</title><desc id="desc">Стадии меняют состав обучающей смеси. Дополнительные малоресурсные языки включаются в фазе снижения скорости обучения. Общий кодировщик создаёт состояния и MLM-прогнозы всех включённых языков.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1280" height="900" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">mmBERT: расписание языков и одна общая модель</tspan></text>
<rect x="35" y="110" width="535" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="49" dy="0">Ранние стадии</tspan><tspan x="49" dy="27">Исходная смесь языков</tspan><tspan x="49" dy="27">Отбор и подготовка данных</tspan></text>
<rect x="710" y="110" width="535" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="724" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="724" dy="0">Стадия снижения скорости обучения</tspan><tspan x="724" dy="27">Добавлены малоресурсные языки</tspan><tspan x="724" dy="27">Обновлённое распределение текстов</tspan></text>
<path d="M570,170 L710,170" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="390" width="895" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="364" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="364" dy="0">Общий токенизатор → входные представления [B,L,D]</tspan><tspan x="364" dy="27">Двунаправленный стек: внимание / FFN / residual / нормализация</tspan><tspan x="364" dy="27">Один набор параметров, обучаемый на текущей смеси</tspan></text>
<path d="M300,230 L300,450 L350,450" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M975,230 L975,390" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="690" width="895" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="364" y="717" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="364" dy="0">Выбранные состояния → MLM-голова → ошибка исходных токенов</tspan><tspan x="364" dy="27">Проверка отдельно по языкам и прикладным задачам</tspan></text>
<path d="M800,510 L800,690" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
