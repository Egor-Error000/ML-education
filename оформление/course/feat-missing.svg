<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" role="img" aria-labelledby="title desc"><title id="title">Один вход — три разных состояния</title><desc id="desc">Пропуск рассматривается до поиска в сохранённом словаре. Известную редкую и новую категорию можно объединить лишь по установленному правилу.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="730" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Один вход — три разных состояния</tspan></text>
<rect x="285" y="75" width="540" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="299" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="299" dy="0">Входное значение и сохранённая схема</tspan></text>
<rect x="25" y="245" width="310" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="39" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="39" dy="0">Пропуск</tspan></text>
<rect x="25" y="385" width="310" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="39" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="39" dy="0">Отдельный MISSING</tspan><tspan x="39" dy="23">или мода + индикатор M</tspan></text>
<path d="M560,145 L560,190 L180,190 L180,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180,330 L180,385" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="245" width="310" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="419" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="419" dy="0">Известная категория</tspan></text>
<rect x="405" y="385" width="310" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="419" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="419" dy="0">Частая → свой код</tspan><tspan x="419" dy="23">редкая → OTHER по train</tspan></text>
<path d="M560,145 L560,190 L560,190 L560,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,330 L560,385" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="785" y="245" width="310" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">Новая категория</tspan></text>
<rect x="785" y="385" width="310" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="799" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="799" dy="0">Не найдена в словаре</tspan><tspan x="799" dy="23">UNK / OTHER по контракту</tspan></text>
<path d="M560,145 L560,190 L940,190 L940,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M940,330 L940,385" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190" y="570" width="740" height="82" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="204" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="204" dy="0">После сохранения: те же ключи, коды и веса.</tspan><tspan x="204" dy="24">Срезы: доля пропусков, неизвестных и качество.</tspan></text></svg>
