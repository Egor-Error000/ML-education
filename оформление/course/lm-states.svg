<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc"><title id="title">Таблица embeddings, состояния и оценки словаря</title><desc id="desc">Входной lookup выбирает строки E. Контекстная сеть изменяет состояния. При общей таблице выходная проекция использует транспонированную E.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="770" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Таблица embeddings, состояния и оценки словаря</tspan></text>
<rect x="40" y="90" width="470" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">IDs: [1,2,1] [B,L]</tspan><tspan x="54" dy="24">Целые индексы; градиент по IDs не считают</tspan></text>
<rect x="40" y="215" width="470" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">E [V,D] → выбрать строки E[1], E[2], E[1]</tspan><tspan x="54" dy="24">Повтор ID 1 суммирует вклады в одну строку</tspan></text>
<path d="M275.0,175 L275.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="340" width="470" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Контекстная сеть → H [B,L,D]</tspan><tspan x="54" dy="24">Один ID может иметь разные состояния</tspan></text>
<path d="M275.0,300 L275.0,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="465" width="470" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Одна позиция: h=(0.2,0.9,0.1)</tspan><tspan x="54" dy="24">Ширина состояния D=3</tspan></text>
<path d="M275.0,425 L275.0,465" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="100" width="420" height="180" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Учебная E [5,3]</tspan><tspan x="664" dy="24">E[0]=(0,0,1)   E[1]=(1,0,0)</tspan><tspan x="664" dy="24">E[2]=(0,1,0)   E[3]=(1,1,0)</tspan><tspan x="664" dy="24">E[4]=(−1,0,1)</tspan><tspan x="664" dy="24">V=5 и D=3 — разные оси</tspan></text>
<rect x="650" y="390" width="420" height="120" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">h Eᵀ → logits [V]</tspan><tspan x="664" dy="24">(0.1, 0.2, 0.9, 1.1, −0.1)</tspan><tspan x="664" dy="24">argmax(logits)=3</tspan></text>
<path d="M510,507 L575,507 L575,450 L650,450" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,280 L860,390" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="635" width="1030" height="90" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Во время обычного инференса веса E и сети фиксированы.</tspan><tspan x="54" dy="24">Меняются вход и активации; шаг оптимизатора появляется только в обучении.</tspan></text></svg>
