<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">FPN: lateral и top-down связи</title><desc id="desc">Top-down путь передаёт глубокую семантику к более подробным сеткам. На каждом уровне сумма требует совпадения spatial shape и channels после lateral projection. Detector heads читают P-levels; matching и AP остаются отдельными этапами.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="570" rx="16" fill="#f5f8f5"/>
<text x="28" y="36" font-family="Segoe UI,sans-serif" font-size="22" fill="#173644">FPN: lateral и top-down связи</text>
<path d="M290,146 L365,146" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="327.5" y="138.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">backbone</text>
<path d="M625,146 L700,146" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662.5" y="138.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">backbone</text>
<path d="M830,192 L830,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830.0" y="258.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">1×1</text>
<path d="M495,192 L495,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495.0" y="258.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">1×1</text>
<path d="M160,192 L160,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="160.0" y="258.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">1×1</text>
<path d="M700,386 L625,386" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662.5" y="378.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">upsample</text>
<path d="M365,386 L290,386" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="327.5" y="378.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">upsample</text>
<rect x="30" y="100" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="160" y="136.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">C2: high-resolution</text>
<text x="160" y="155.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">backbone features</text>
<rect x="365" y="100" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="146.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">C3: middle scale</text>
<rect x="700" y="100" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="146.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">C4: deep coarse scale</text>
<rect x="700" y="340" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="386.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">P4: lateral projection</text>
<rect x="365" y="340" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="386.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">P3: lateral + upsample(P4)</text>
<rect x="30" y="340" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="160" y="386.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">P2: lateral + upsample(P3)</text>
<text x="28" y="550" font-family="Segoe UI,sans-serif" font-size="13" fill="#526b75">Зелёный: модель / преобразование; серый: вход, состояние или результат. Пунктир: обход / управление.</text></svg>