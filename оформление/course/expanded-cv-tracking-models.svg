<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 448" role="img" aria-labelledby="title desc">
<title id="title">SORT, DeepSORT, ByteTrack и BoT-SORT: разбор последовательности</title><desc id="desc">SORT / DeepSORT: Detector → boxes / crops → Kalman predict + motion gate → IoU; appearance + cascade → Update ID / lifecycle; ByteTrack / BoT-SORT: Tracks → motion prediction → High-score association → Low-score recovery; camera motion → Matched update / lost / new</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416474"/></marker></defs>
<rect width="1120" height="448" rx="14" fill="#f6f8fb"/>
<text x="30" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#173b50">SORT, DeepSORT, ByteTrack и BoT-SORT: разбор последовательности</text>
<text x="30" y="112" font-family="Arial,sans-serif" font-size="18" fill="#315a67">SORT / DeepSORT</text>
