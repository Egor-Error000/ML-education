<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">Правило выбора: порядок преобразований важен</title><desc id="desc">Логиты задаёт модель; штрафы, температура, ограничения и фильтры задают объявленный закон выбора.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="790" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Правило выбора: порядок преобразований важен</tspan></text>
<rect x="80" y="100" width="480" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="94" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="94" dy="0">Логиты z → выбранные processors</tspan></text>
<rect x="80" y="230" width="480" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="94" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="94" dy="0">Допустимые токены / штрафы / температура</tspan></text>
<path d="M320.0,190 L320.0,230" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="360" width="480" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="94" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="94" dy="0">Отсечение top-k / nucleus → нормировка</tspan></text>
<path d="M320.0,320 L320.0,360" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="490" width="480" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="94" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="94" dy="0">Greedy либо sampling → новый ID</tspan></text>
<path d="M320.0,450 L320.0,490" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="700" y="210" width="370" height="180" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="714" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="714" dy="0">Порядок фиксируют явно.</tspan><tspan x="714" dy="24">Для (.4,.3,.2,.1), k=2,p=.55:</tspan><tspan x="714" dy="24">top-k → nucleus: один кандидат.</tspan><tspan x="714" dy="24">nucleus → top-k: два.</tspan><tspan x="714" dy="24">Один T&gt;0 сохраняет argmax.</tspan></text>
<text x="35" y="745" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Грамматика, смысл результата и достижение цели проверяются на разных уровнях. EOS требует принимающего состояния.</tspan></text></svg>
