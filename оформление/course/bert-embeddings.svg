<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" role="img" aria-labelledby="title desc"><title id="title">Вектор предложения: encoder, pooling и обученная геометрия</title><desc id="desc">Два текста кодируются независимо; общий encoder можно использовать дважды. Цель сравнения обучает пространство, а pooling сам по себе его не гарантирует.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="730" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Вектор предложения: encoder, pooling и обученная геометрия</tspan></text>
<rect x="40" y="90" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Текст a → IDs и маска</tspan></text>
<rect x="40" y="215" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Один и тот же encoder</tspan><tspan x="54" dy="24">H [L,D]</tspan></text>
<path d="M250.0,175 L250.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="340" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Pooling только реальных позиций</tspan><tspan x="54" dy="24">z [d], необязательная нормировка</tspan></text>
<path d="M250.0,300 L250.0,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="90" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Текст b → IDs и маска</tspan></text>
<rect x="650" y="215" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Один и тот же encoder</tspan><tspan x="664" dy="24">H [L,D]</tspan></text>
<path d="M860.0,175 L860.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="340" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Pooling только реальных позиций</tspan><tspan x="664" dy="24">z [d], необязательная нормировка</tspan></text>
<path d="M860.0,300 L860.0,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="555" width="450" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="354" y="582" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="354" dy="0">dot / cosine / расстояние</tspan><tspan x="354" dy="24">Loss по паре или набору сравнений</tspan><tspan x="354" dy="24">Градиенты идут в оба прохода</tspan></text>
<path d="M250,425 L250,605 L340,605" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,425 L860,605 L790,605" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="700" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Версия encoder, pooling, нормировка и префиксы образуют единый контракт с индексом.</tspan></text></svg>
