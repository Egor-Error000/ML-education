<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc"><title id="title">SpanBERT: восстановление фрагмента двумя ветвями</title><desc id="desc">Контекстные состояния выбранных позиций задают обычный MLM. Внешние границы фрагмента вместе с относительной позицией дают отдельный прогноз содержимого. Обе ошибки учат общий стек.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1280" height="950" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">SpanBERT: восстановление фрагмента двумя ветвями</tspan></text>
<rect x="35" y="100" width="1210" height="95" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="49" dy="0">Текст: x_(s−1), [MASK] … [MASK], x_(e+1)</tspan><tspan x="49" dy="27">Выбран непрерывный фрагмент s…e; оригинальные ID сохранены отдельно</tspan></text>
<rect x="350" y="285" width="580" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="364" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="364" dy="0">Двунаправленный кодировщик</tspan><tspan x="364" dy="27">Состояния H [B,L,D]</tspan></text>
<path d="M640,195 L640,285" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="500" width="535" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="49" dy="0">Внутренние H_s … H_e</tspan><tspan x="49" dy="26">MLM-голова → логиты словаря</tspan><tspan x="49" dy="26">CE по исходным ID фрагмента</tspan></text>
<rect x="710" y="500" width="535" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="724" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="724" dy="0">Внешние H_(s−1), H_(e+1) + позиция i−s+1</tspan><tspan x="724" dy="24">Объединить → двухслойная сеть → словарь</tspan><tspan x="724" dy="24">SBO: CE по тому же исходному ID i</tspan></text>
<path d="M350,327 L300,327 L300,500" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M930,327 L975,327 L975,500" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="780" width="895" height="85" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="364" y="807" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="364" dy="0">MLM + цель по границам (SBO) → обновить общий кодировщик</tspan><tspan x="364" dy="26">Граничный прогноз не использует внутреннее H_i напрямую</tspan></text>
<path d="M300,620 L300,822 L350,822" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M975,620 L975,780" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
