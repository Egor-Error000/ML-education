<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">SciBERT и CodeBERT: корпус и цель предобучения</title><desc id="desc">SciBERT использует научный корпус и MLM-подобное обучение BERT. CodeBERT обучает NL и код с MLM и обнаружением заменённых токенов. Прикладную голову ещё нужно адаптировать.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="790" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">SciBERT и CodeBERT: корпус и цель предобучения</tspan></text>
<rect x="40" y="100" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Научные тексты</tspan><tspan x="54" dy="24">SciBERT: доменный корпус и словарь</tspan></text>
<rect x="40" y="225" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">BERT encoder</tspan><tspan x="54" dy="24">MLM и предобучение BERT</tspan></text>
<path d="M250.0,185 L250.0,225" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Состояния → голова научной задачи</tspan><tspan x="54" dy="24">Обучение на её разметке</tspan></text>
<path d="M250.0,310 L250.0,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="100" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Естественный язык + исходный код</tspan><tspan x="664" dy="24">CodeBERT: смешанные данные</tspan></text>
<rect x="650" y="225" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Encoder</tspan><tspan x="664" dy="24">MLM + обнаружение заменённых токенов</tspan></text>
<path d="M860.0,185 L860.0,225" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="350" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Состояния → поиск / иная голова</tspan><tspan x="664" dy="24">Обучение на целевой задаче</tspan></text>
<path d="M860.0,310 L860.0,350" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="590" width="1030" height="120" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="617" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Доменная близость корпуса — основание для проверки, а не обещание качества.</tspan><tspan x="54" dy="24">Отдельно сравнивают словарь, вычислительный бюджет и независимую метрику задачи.</tspan><tspan x="54" dy="24">Клоны кода и версии репозитория группируют до split; тесты исполнения — отдельный источник оценки.</tspan></text></svg>
