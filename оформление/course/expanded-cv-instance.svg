<rect width="1120" height="283" rx="14" fill="#f6f8fb"/>
<text x="30" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#173b50">Instance segmentation: Mask R-CNN и prototype masks</text>
<text x="30" y="112" font-family="Arial,sans-serif" font-size="18" fill="#315a67">Mask R-CNN head</text>
<rect x="30" y="131" width="235" height="94" rx="9" fill="#dceafa" stroke="#718b9b"/>
<text x="147.5" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">Positive RoI + shared</text>
<text x="147.5" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173b50">features</text>
