<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">MHA, GQA, MQA: разные запросы могут читать общие K/V</title><desc id="desc">В трёх панелях четыре query-примера. Линии задают использование KV-головы, не равенство запросных векторов.</desc>
