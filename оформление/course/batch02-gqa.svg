<text x="35" y="590" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Реальный пример Hq=32,Hkv=8: четыре разные Q-головы на одну KV-группу.</tspan><tspan x="35" dy="24">Обученные веса и mapping должны соответствовать архитектуре; это не runtime-удаление лишних K/V.</tspan></text></svg>
