<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">Категории: частота и хэш сохраняют разные свойства</title><desc id="desc">Частота объединяет значения с одинаковым числом наблюдений. Хэш задаёт фиксированное число ячеек и может связать разные ключи.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="700" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Категории: частота и хэш сохраняют разные свойства</tspan></text>
<rect x="320" y="70" width="480" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="334" y="97" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="334" dy="0">Обучающие значения: A, A, B, B, C</tspan></text>
<rect x="35" y="245" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Частоты A/B/C: 0.4 / 0.4 / 0.2</tspan><tspan x="49" dy="24">A и B неразличимы по частоте</tspan></text>
<rect x="620" y="245" width="470" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="634" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="634" dy="0">Ключ поля + значение → хэш</tspan><tspan x="634" dy="24">A и B могут попасть в одну ячейку</tspan></text>
<path d="M560,145 L560,190 L270,190 L270,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,190 L855,190 L855,245" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="465" width="780" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="184" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="184" dy="0">Словарь частот обучают только на разрешённой части.</tspan><tspan x="184" dy="24">Для хэша сохраняют алгоритм, размер, seed и сериализацию.</tspan></text>
<path d="M270,335 L270,405 L400,405 L400,465" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M855,335 L855,405 L720,405 L720,465" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
