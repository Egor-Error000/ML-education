<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">MAE: видимый вход и скрытая цель</title><desc id="desc">Только visible tokens проходят encoder. Decoder получает latent и placeholders с восстановленными позициями. Loss сопоставляет выбранные outputs с исходными masked pixels; исходные targets не подаются encoder как видимые входы.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="680" rx="16" fill="#f5f8f5"/>
<text x="28" y="36" font-family="Segoe UI,sans-serif" font-size="22" fill="#173644">MAE: видимый вход и скрытая цель</text>
<path d="M290,136 L365,136" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625,136 L700,136" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662.5" y="128.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">visible</text>
<path d="M830,182 L830,310" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830.0" y="238.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">latent</text>
<path d="M495,90 C495,25 830,245 830,310" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="662.5" y="54" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">indices / mask tokens</text>
<path d="M700,356 L625,356" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M160,182 L160,310" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="160.0" y="238.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">target values</text>
<path d="M365,356 L290,556" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M160,402 L160,510" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="90" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="126.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">original patches</text>
<text x="160" y="145.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">и позиции</text>
<rect x="365" y="90" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="136.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">выбрать visible / masked</text>
<rect x="700" y="90" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="136.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">encoder visible tokens</text>
<rect x="30" y="310" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="356.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">original masked pixels</text>
<rect x="365" y="310" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="356.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">reconstructed patches</text>
<rect x="700" y="310" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="346.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">decoder: latent + positions</text>
<text x="830" y="365.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">+ mask tokens</text>
<rect x="30" y="510" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="556.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">loss на masked positions</text>
<text x="28" y="660" font-family="Segoe UI,sans-serif" font-size="13" fill="#526b75">Зелёный: модель / преобразование; серый: вход, состояние или результат. Пунктир: обход / управление.</text></svg>