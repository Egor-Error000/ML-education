<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc"><title id="title">Изображения: один снимок или отдельные области</title><desc id="desc">Верхняя ветвь агрегирует карту фиксированного кодировщика в один вектор снимка. Нижняя строит связные суперпиксели по цвету и положению. Выходные номера относятся к разным единицам анализа.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1280" height="1040" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Изображения: один снимок или отдельные области</tspan></text>
<text x="35" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="35" dy="0">1. Группа целого снимка: один объект → один вектор → один номер</tspan></text>
<rect x="35" y="135" width="270" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Снимок</tspan><tspan x="49" dy="24">[H,W,3]</tspan><tspan x="49" dy="24">Предобработка</tspan></text>
<rect x="350" y="135" width="270" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="364" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="364" dy="0">Фиксированная CNN</tspan><tspan x="364" dy="24">Карта [h,w,c]</tspan><tspan x="364" dy="24">Веса не меняются</tspan></text>
<path d="M305,195 L350,195" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="665" y="135" width="270" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="679" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="679" dy="0">Среднее по h,w</tspan><tspan x="679" dy="24">Вектор [c]</tspan><tspan x="679" dy="24">Нормировка / PCA</tspan></text>
<path d="M620,195 L665,195" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="980" y="135" width="270" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="994" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="994" dy="0">Кластеризация</tspan><tspan x="994" dy="24">Номер группы</tspan><tspan x="994" dy="24">или отказ</tspan></text>
<path d="M935,195 L980,195" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="325" width="900" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="364" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="364" dy="0">Пример карты 2×2×2: (1,0), (3,2), (5,4), (7,2)</tspan><tspan x="364" dy="26">Среднее (4,2) → L2-норма √20 → (0.894427, 0.447214)</tspan></text>
<path d="M800,255 L800,325" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="35" dy="0">2. Области снимка: один пиксель → цвет и положение → номер суперпикселя</tspan></text>
<rect x="35" y="575" width="270" height="120" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="49" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Пиксели Lab</tspan><tspan x="49" dy="24">и координаты (i,j)</tspan><tspan x="49" dy="24">N=H·W объектов</tspan></text>
<rect x="350" y="575" width="270" height="120" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="364" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="364" dy="0">Начальные центры</tspan><tspan x="364" dy="24">Шаг S≈√(N/K)</tspan><tspan x="364" dy="24">Параметр m</tspan></text>
<path d="M305,635 L350,635" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="665" y="575" width="270" height="120" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="679" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="679" dy="0">Локально: назначить</tspan><tspan x="679" dy="24">по D, обновить</tspan><tspan x="679" dy="24">цвет и положение</tspan></text>
<path d="M620,635 L665,635" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="980" y="575" width="270" height="120" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="994" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="994" dy="0">Проверить связность</tspan><tspan x="994" dy="24">Карта [H,W]</tspan><tspan x="994" dy="24">номеров областей</tspan></text>
<path d="M935,635 L980,635" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800,695 L800,755 L485,755 L485,695" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="806" y="687" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="806" dy="0">Повторять назначения и обновления</tspan></text>
<rect x="35" y="825" width="1215" height="110" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="49" y="852" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="49" dy="0">D² = d_c² + (m/S)² d_s²; сравниваются цвет и положение пикселя и центра</tspan><tspan x="49" dy="26">Увеличить m → регулярнее области; уменьшить m → сильнее цветовые границы</tspan><tspan x="49" dy="26">Суперпиксель не является готовым смысловым классом</tspan></text>
<text x="35" y="1000" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="35" dy="0">Просмотр результата: объекты, фон и дубликаты для снимков; границы и связность для областей.</tspan></text></svg>
