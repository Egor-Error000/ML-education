<text x="679" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="679" dy="0">✓</tspan></text>
<rect x="730" y="335" width="58" height="58" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="744" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="744" dy="0">✓</tspan></text>
<text x="600" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="600" dy="0">строка = запрос i</tspan></text>
<text x="870" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="870" dy="0">Причинная</tspan></text>
<text x="870" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="870" dy="0">столбец = ключ j</tspan></text>
