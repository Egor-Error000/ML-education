<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc"><title id="title">Позиция и маска решают разные задачи</title><desc id="desc">Позиционный сигнал задаёт расположение, маска ограничивает доступ к ключам. Показаны двунаправленная и причинная матрицы доступа для трёх позиций.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="770" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Позиция и маска решают разные задачи</tspan></text>
<rect x="40" y="90" width="460" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">X [L,D]: содержимое токенов</tspan><tspan x="54" dy="24">+ обучаемые или синусные P [L,D]</tspan><tspan x="54" dy="24">либо поворот Q и K в RoPE</tspan></text>
<rect x="40" y="270" width="460" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">QKᵀ / √dₖ [L,L]</tspan><tspan x="54" dy="24">Добавить маску M до softmax</tspan><tspan x="54" dy="24">Запрещённая пара получает −∞</tspan></text>
<path d="M270,190 L270,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="460" width="460" height="120" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="54" y="487" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">softmax по разрешённым ключам</tspan><tspan x="54" dy="24">Взвешенная сумма V</tspan><tspan x="54" dy="24">Причинную маску применяют</tspan><tspan x="54" dy="24">в каждом слое</tspan></text>
<path d="M270,370 L270,460" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="600" dy="0">Двунаправленная</tspan></text>
<text x="600" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="600" dy="0">столбец = ключ j</tspan></text>
<rect x="600" y="185" width="58" height="58" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="614" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="614" dy="0">✓</tspan></text>
