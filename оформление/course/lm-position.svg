<rect x="870" y="335" width="58" height="58" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="884" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="884" dy="0">✓</tspan></text>
