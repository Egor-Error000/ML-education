<text x="949" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="949" dy="0">✓</tspan></text>
<rect x="1000" y="335" width="58" height="58" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="1014" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="1014" dy="0">✓</tspan></text>
<text x="870" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="870" dy="0">строка = запрос i</tspan></text>
<rect x="590" y="500" width="480" height="115" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="604" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="604" dy="0">Padding маскирует искусственные ключи.</tspan><tspan x="604" dy="23">Строки padding-запросов отдельно</tspan><tspan x="604" dy="23">исключают из loss или pooling.</tspan><tspan x="604" dy="23">Пустая строка softmax требует обработки.</tspan></text>
<text x="35" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Причинная маска уже нарушает симметрию перестановок, но не заменяет полный позиционный сигнал.</tspan></text></svg>
