<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310"><title>Цикл обучения рассуждению</title><desc>Задачи поступают в генератор попыток, затем verifier вычисляет награды, trainer обновляет policy и передаёт checkpoint генератору и независимой оценке.</desc><rect width="1100" height="310" rx="18" fill="#f1f5ef"/><g font-family="Arial,sans-serif" fill="#193b3a" text-anchor="middle"><text x="550" y="38" font-size="24" font-weight="bold">Цикл обучения и независимая оценка</text><g fill="#ffffff" stroke="#7da69b" stroke-width="2"><rect x="30" y="90" width="190" height="78" rx="10"/><rect x="250" y="90" width="190" height="78" rx="10"/><rect x="470" y="90" width="190" height="78" rx="10"/><rect x="690" y="90" width="190" height="78" rx="10"/><rect x="875" y="210" width="200" height="65" rx="10"/></g><g font-size="17"><text x="125" y="123">Задачи и split</text><text x="125" y="148">версия данных</text><text x="345" y="123">Rollout</text><text x="345" y="148">версия policy</text><text x="565" y="123">Verifier</text><text x="565" y="148">reward и статус</text><text x="785" y="123">Trainer</text><text x="785" y="148">checkpoint</text><text x="975" y="240">Оценка на новых</text><text x="975" y="262">задачах</text></g></g><g fill="none" stroke="#327362" stroke-width="3" marker-end="url(#arrow)"><path d="M220 129H245 M440 129H465 M660 129H685 M880 129H975V205"/><path d="M785 170V195H345V172"/></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#327362"/></marker></defs></svg>
