<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">Устойчивость: сравниваются общие объекты и состав групп</title><desc id="desc">Два запуска используют разные подвыборки. На пересечении объектов сравниваются разбиения с учётом перестановки номеров; исключённые объекты сообщаются отдельно.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Устойчивость: сравниваются общие объекты и состав групп</tspan></text>
<rect x="35" y="95" width="1050" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="49" dy="0">Исходные объекты: A, B, C, D, E, F</tspan><tspan x="49" dy="26">Сохраняются постоянные идентификаторы объектов</tspan></text>
<rect x="35" y="320" width="470" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="347" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Запуск 1: A, B, C, D, E</tspan><tspan x="49" dy="24">Номера групп: 0, 0, 1, 1, 1</tspan><tspan x="49" dy="24">Сохранить настройки и состояние случайности</tspan></text>
<rect x="635" y="320" width="450" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="649" y="347" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="649" dy="0">Запуск 2: A, B, C, D, F</tspan><tspan x="649" dy="24">Номера групп: 7, 7, 3, 3, 3</tspan><tspan x="649" dy="24">Та же единица оценки и геометрия</tspan></text>
<path d="M560,185 L560,245 L270,245 L270,320" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,245 L860,245 L860,320" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="585" width="1050" height="125" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="49" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#173644"><tspan x="49" dy="0">Общие объекты: A, B, C, D</tspan><tspan x="49" dy="25">[0,0,1,1] и [7,7,3,3] → одинаковые пары → ARI=1</tspan><tspan x="49" dy="25">Общих объектов 4 из 6; E и F не сравнивались. Совпадение не устанавливает смысловую правильность.</tspan></text>
<path d="M270,440 L270,585" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,440 L860,585" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
