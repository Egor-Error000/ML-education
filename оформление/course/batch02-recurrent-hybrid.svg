<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc"><title id="title">Рекуррентная история и гибридная модель</title><desc id="desc">Mamba обновляет состояние; Jamba сочетает рекуррентные и Transformer-слои с предусмотренной архитектурой MoE. Это не опции кеша произвольного checkpoint.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="900" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Рекуррентная история и гибридная модель</tspan></text>
<text x="40" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="40" dy="0">Mamba: пример маршрута одного блока</tspan></text>
<rect x="40" y="130" width="450" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="157" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">xₜ → линейные ветви, локальная conv</tspan></text>
<rect x="40" y="260" width="450" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="287" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Зависящие от входа параметры SSM</tspan></text>
<path d="M265.0,220 L265.0,260" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="390" width="450" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">sₜ₋₁ → обновление sₜ → выход</tspan></text>
<path d="M265.0,350 L265.0,390" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="170" width="420" height="140" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="197" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Управляющая ветвь от xₜ</tspan><tspan x="664" dy="24">Нелинейность → умножение выхода SSM</tspan><tspan x="664" dy="24">Выходная проекция → residual</tspan><tspan x="664" dy="24">Состояние не является таблицей всех KV.</tspan></text>
<path d="M490,175 L570,175 L570,220 L650,220" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M490,435 L860,435 L860,310" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="610" width="1030" height="100" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="637" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Jamba (AI21): обученное чередование Mamba и attention-блоков; MoE в предусмотренных местах.</tspan><tspan x="54" dy="24">Attention-слой хранит свою KV-историю; рекуррентный — своё состояние.</tspan><tspan x="54" dy="24">Наличие full-attention части сохраняет её затраты по длине.</tspan></text>
<text x="35" y="805" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Схема различает сохраняемые объекты. Сжатое состояние не обещает точного восстановления любой старой цитаты.</tspan></text></svg>
