<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc"><title id="title">Длинный документ: три разных места потери информации</title><desc id="desc">Усечение удаляет текст. Окна оставляют локальный контекст. Иерархическая схема сжимает окна и учится связывать их представления.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="770" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Длинный документ: три разных места потери информации</tspan></text>
<rect x="40" y="90" width="1030" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Документ: [часть A] [часть B] [часть C] [часть D]</tspan><tspan x="54" dy="24">Ответ может требовать одновременно A и D.</tspan></text>
<rect x="35" y="280" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Усечение</tspan></text>
<rect x="35" y="405" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Encoder видит только префикс</tspan></text>
<path d="M185.0,365 L185.0,405" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="530" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="557" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">D отсутствует во входе</tspan></text>
<path d="M185.0,490 L185.0,530" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,170 L555,225 L185,225 L185,280" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="280" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Перекрывающиеся окна</tspan></text>
<rect x="410" y="405" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Encoder каждого окна отдельно</tspan></text>
<path d="M560.0,365 L560.0,405" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="530" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="557" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Агрегация scores / ответов</tspan></text>
<path d="M560.0,490 L560.0,530" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,170 L555,225 L560,225 L560,280" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="785" y="280" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">Иерархическая модель</tspan></text>
<rect x="785" y="405" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">Encoder → вектор каждого окна</tspan></text>
<path d="M935.0,365 L935.0,405" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="785" y="530" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="557" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">Второй уровень связывает окна</tspan></text>
<path d="M935.0,490 L935.0,530" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,170 L555,225 L935,225 L935,280" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="730" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Видимый целиком ответ: O ≥ A−1 при длине ответа A≤C. Связь между далёкими окнами этим не гарантируется.</tspan></text></svg>
