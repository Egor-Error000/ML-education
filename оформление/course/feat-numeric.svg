<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Числовые признаки: обучение и применение</title><desc id="desc">Обучающие данные задают параметры преобразования. Новые данные и сохранённые параметры отдельно поступают в transform; новые значения не возвращаются в fit.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="650" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Числовые признаки: обучение и применение</tspan></text>
<rect x="35" y="100" width="310" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Обучающие значения</tspan><tspan x="49" dy="24">1 и 3; единицы известны</tspan></text>
<rect x="410" y="100" width="300" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">fit: μ=2, s=1</tspan><tspan x="424" dy="24">Сохранить параметры</tspan></text>
<path d="M345,150 L410,150" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="775" y="100" width="305" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="789" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="789" dy="0">Обучающие координаты</tspan><tspan x="789" dy="24">−1 и 1</tspan></text>
<path d="M710,150 L775,150" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="340" width="310" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Новый объект: x=100</tspan><tspan x="49" dy="24">Те же поля и единицы</tspan></text>
<rect x="410" y="340" width="300" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Только transform</tspan><tspan x="424" dy="24">z=(x−μ)/s</tspan></text>
<path d="M345,390 L410,390" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,200 L560,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="575" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#173644"><tspan x="575" dy="0">сохранённые μ и s</tspan></text>
<rect x="775" y="340" width="305" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="789" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="789" dy="0">Новая координата: 98</tspan><tspan x="789" dy="24">Вход модели</tspan></text>
<path d="M710,390 L775,390" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="520" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Новый объект не меняет μ и s. Пропуски, нулевой масштаб и clipping имеют отдельные правила.</tspan></text>
<text x="35" y="565" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Для перекрёстной проверки fit повторяется только на обучающей части каждой складки.</tspan></text></svg>
