<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc"><title id="title">Выбор строк и общий градиент категориальной таблицы</title><desc id="desc">Таблица хранит параметры для каждого ID; повторные обращения к одному ID складывают вклады градиента.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="750" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Выбор строк и общий градиент категориальной таблицы</tspan></text>
<rect x="25" y="70" width="300" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="39" y="97" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="39" dy="0">ID в пакете: A, A, B</tspan><tspan x="39" dy="24">каждый ID ссылается на строку</tspan></text>
<rect x="415" y="70" width="310" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="429" y="97" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="429" dy="0">Таблица E: K × d</tspan><tspan x="429" dy="24">A → (1,2); B → (−1,0)</tspan></text>
<rect x="800" y="70" width="290" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="814" y="97" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="814" dy="0">Векторы пакета: 3 × d</tspan><tspan x="814" dy="24">A, A, B</tspan></text>
<path d="M325,120 L415,120" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M725,120 L800,120" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="160" y="315" width="800" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="174" y="342" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="174" dy="0">Линейная голова и функция потерь</tspan><tspan x="174" dy="24">прогнозы: −1.5, −1.5, −0.5; метки: 0, 1, −1</tspan></text>
<path d="M945,170 L945,255 L560,255 L560,315" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="505" width="490" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="39" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="39" dy="0">Градиент строки A = сумма двух вкладов</tspan><tspan x="39" dy="24">(−2/3, 4/3)</tspan></text>
<rect x="605" y="505" width="490" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="619" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="619" dy="0">Градиент строки B: (1/12, −1/6)</tspan><tspan x="619" dy="24">усреднение по трём строкам уже учтено</tspan></text>
<path d="M560,415 L560,460 L270,460 L270,505" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,460 L850,460 L850,505" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="665" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Новая категория требует обученного UNKNOWN или доступных признаков объекта; случайная строка не знает её эффекта.</tspan></text></svg>
