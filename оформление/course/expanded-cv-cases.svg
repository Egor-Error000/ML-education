<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 448" role="img" aria-labelledby="title desc">
<title id="title">Сквозные разборы: дефекты, видеопоток и документы</title><desc id="desc">Контроль дефектов: Independent product + labels → Classifier / mask / anomaly → Threshold + review capacity → Miss cost + false alarms; Видео и документы: Frames / page regions → Tracking / OCR + structure → Event logic / field assignment → End-to-end errors + evidence</desc>
