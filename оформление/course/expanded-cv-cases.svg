<text x="30" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#173b50">Сквозные разборы: дефекты, видеопоток и документы</text>
<text x="30" y="112" font-family="Arial,sans-serif" font-size="18" fill="#315a67">Контроль дефектов</text>
