<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Transformer: две residual-связи</title><desc id="desc">Обходы передают те же x и u к суммам; ветви обязаны вернуть D координат. Порядок на рисунке — Pre-Norm.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="560" rx="16" fill="#f5f8f5"/>
<text x="28" y="36" font-family="Segoe UI,sans-serif" font-size="22" fill="#173644">Transformer: две residual-связи</text>
<path d="M290,176 L365,176" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625,176 L700,176" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830,222 L830,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M160,130 C160,65 830,265 830,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="495.0" y="94" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">identity x</text>
<path d="M700,376 L625,376" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M365,376 L290,376" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830,330 C830,265 160,265 160,330" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="495.0" y="294" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">identity u</text>
<rect x="30" y="130" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="176.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">x [B,L,D]</text>
<rect x="365" y="130" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="176.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">Norm по D</text>
<rect x="700" y="130" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="176.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">Attention(Q,K,V)</text>
<rect x="700" y="330" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="376.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">u = x + attention</text>
<rect x="365" y="330" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="366.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">Norm → gated MLP</text>
<text x="495" y="385.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">D → Dff → D</text>
<rect x="30" y="330" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="160" y="376.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">y = u + MLP</text>
<text x="28" y="540" font-family="Segoe UI,sans-serif" font-size="13" fill="#526b75">Зелёный: модель / преобразование; серый: вход, состояние или результат. Пунктир: обход / управление.</text></svg>