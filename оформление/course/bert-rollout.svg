<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">Обновление поиска: согласованные версии и откат</title><desc id="desc">Новый encoder требует совместимого индекса. Новый комплект проверяют параллельно старому, затем переключают маршрутизацию. Откат восстанавливает весь комплект.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="800" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Обновление поиска: согласованные версии и откат</tspan></text>
<rect x="40" y="90" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Рабочая версия v1</tspan></text>
<rect x="40" y="215" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Encoder v1 + tokenizer / pooling v1</tspan></text>
<path d="M250.0,175 L250.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="340" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Индекс v1 + корпус / ACL v1</tspan></text>
<path d="M250.0,300 L250.0,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="90" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Кандидат v2: построить из снимка</tspan></text>
<rect x="650" y="215" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Encoder v2 + tokenizer / pooling v2</tspan></text>
<path d="M860.0,175 L860.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="340" width="420" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Индекс v2 + догнать изменения / удаления</tspan></text>
<path d="M860.0,300 L860.0,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="525" width="450" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="354" y="552" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="354" dy="0">Shadow: сравнить без влияния на ответ</tspan><tspan x="354" dy="23">Canary: малая доля реальных ответов</tspan><tspan x="354" dy="23">После приёмки → переключить комплект</tspan></text>
<path d="M250,425 L250,575 L340,575" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,425 L860,575 L790,575" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="725" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Для отката сохраняют v1 целиком и продолжают учитывать новые документы, удаления и права доступа.</tspan><tspan x="35" dy="24">Две версии индекса одновременно требуют отдельного расчёта памяти и диска.</tspan></text></svg>
