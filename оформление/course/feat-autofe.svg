<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">От доступных событий к проверенному признаку</title><desc id="desc">Временной cutoff предшествует агрегации. Выбор кандидатов и настройки происходят во внутреннем обучении, внешний тест оценивает процедуру.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="760" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">От доступных событий к проверенному признаку</tspan></text>
<rect x="40" y="100" width="460" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">События: дни 1, 3, 9</tspan><tspan x="54" dy="24">Прогноз перед днём 10</tspan></text>
<rect x="40" y="270" width="460" height="100" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="54" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Окно [3,10): дни 3 и 9</tspan><tspan x="54" dy="24">День 9 доступен только в день 11</tspan></text>
<rect x="40" y="460" width="460" height="85" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="54" y="487" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">На момент прогноза count = 1</tspan></text>
<path d="M270,190 L270,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270,370 L270,460" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="100" width="430" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">20 наборов × 3 folds × 5 настроек</tspan><tspan x="664" dy="24">До 300 обучений</tspan></text>
<rect x="650" y="270" width="430" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Внутренняя проверка:</tspan><tspan x="664" dy="24">выбрать выражение и модель</tspan></text>
<rect x="650" y="460" width="430" height="85" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="487" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Внешний тест: оценить</tspan><tspan x="664" dy="24">выбранную процедуру</tspan></text>
<path d="M865,190 L865,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M865,370 L865,460" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
