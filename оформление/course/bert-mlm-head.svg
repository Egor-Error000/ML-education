<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">BERT MLM: от выбранных позиций к ошибке</title><desc id="desc">Состояния только выбранных целей проходят Dense, GELU, LayerNorm и проекцию в словарь. Исходные IDs задают labels, а не изменённый вход.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="670" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">BERT MLM: от выбранных позиций к ошибке</tspan></text>
<rect x="40" y="90" width="460" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Искажённые IDs [B,L]</tspan><tspan x="54" dy="24">Пример: [CLS] кот [MASK] [SEP]</tspan></text>
<rect x="650" y="90" width="420" height="80" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="664" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Исходные IDs и позиции I</tspan><tspan x="664" dy="24">label = ID слова «спит»</tspan></text>
<rect x="40" y="220" width="460" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">BERT encoder → H [B,L,D]</tspan></text>
<rect x="40" y="345" width="460" height="78" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Выбрать H[I] [N_selected,D]</tspan><tspan x="54" dy="24">Dense D→D → GELU → LayerNorm</tspan></text>
<rect x="40" y="470" width="460" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Проекция D→V + bias</tspan><tspan x="54" dy="24">logits [N_selected,V]</tspan></text>
<rect x="650" y="470" width="420" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Cross-entropy по исходным IDs</tspan><tspan x="664" dy="24">Среднее по выбранным целям</tspan><tspan x="664" dy="24">p(«спит»)=0.6 → loss≈0.5108</tspan></text>
<path d="M270,170 L270,220" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270,295 L270,345" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270,423 L270,470" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500,508 L650,508" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,170 L860,470" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">N_selected — суммарное число целей в пакете, V — размер словаря. Padding и выбор целей — разные маски.</tspan></text></svg>
