<rect x="270" y="615" width="580" height="90" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="284" y="642" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="284" dy="0">−(log 0.5 + log 0.25) / 2 = 1.039721</tspan><tspan x="284" dy="24">Нормировка по двум активным целям, не по шести входам.</tspan></text></svg>
