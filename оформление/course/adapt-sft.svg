<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">SFT: вход, сдвиг и разрешённые цели</title><desc id="desc">Входные токены создают состояния; маска выбирает цели после сдвига. Игнорирование вопроса в loss не исключает его из контекста.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
