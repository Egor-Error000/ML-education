<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">Токенизация: текст, подслова и исходные смещения</title><desc id="desc">Нормализация предшествует разбиению. Идентификаторы — индексы словаря, а не значения признака. Смещения сохраняют связь с исходным текстом.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="700" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Токенизация: текст, подслова и исходные смещения</tspan></text>
<rect x="45" y="90" width="480" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="59" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="59" dy="0">Исходный текст: «кот спит»</tspan><tspan x="59" dy="24">Символьные интервалы: [0,3), [4,8)</tspan></text>
<rect x="45" y="215" width="480" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="59" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="59" dy="0">Нормализация и предварительное разбиение</tspan><tspan x="59" dy="24">Правила зависят от сохранённого tokenizer</tspan></text>
<path d="M285.0,175 L285.0,215" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="340" width="480" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="59" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="59" dy="0">Сегментация: слова или подслова</tspan><tspan x="59" dy="24">Пример условного словаря: кот | сп | ##ит</tspan></text>
<path d="M285.0,300 L285.0,340" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="465" width="480" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="59" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="59" dy="0">Специальные позиции и IDs [B,L]</tspan><tspan x="59" dy="24">[CLS] кот сп ##ит [SEP]</tspan></text>
<path d="M285.0,425 L285.0,465" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="100" width="420" height="100" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Словарь</tspan><tspan x="664" dy="24">[CLS]→0; кот→1; сп→2</tspan><tspan x="664" dy="24">##ит→3; [SEP]→4</tspan></text>
<path d="M650,150 L580,150 L580,510 L525,510" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="290" width="420" height="120" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="317" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Смещения для условного примера</tspan><tspan x="664" dy="24">кот [0,3); сп [4,6); ##ит [6,8)</tspan><tspan x="664" dy="24">Специальные позиции не размечают</tspan><tspan x="664" dy="24">реальные символы предложения</tspan></text>
<rect x="650" y="470" width="420" height="110" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="664" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">IDs → lookup в таблице E [V,D]</tspan><tspan x="664" dy="24">0,1,2,3,4 — номера строк</tspan><tspan x="664" dy="24">Их разности не задают близость</tspan></text>
<path d="M525,507 L650,507" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="665" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="35" dy="0">Разбиение здесь учебное. Реальные токены, offsets и специальные IDs проверяют для выбранного tokenizer.</tspan></text></svg>
