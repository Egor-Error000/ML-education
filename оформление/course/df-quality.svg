<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">Диагностика данных до вмешательства</title><desc id="desc">Пропуск, необычное значение и спорная метка требуют разных проверок и не дают автоматического решения об удалении.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="740" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Диагностика данных до вмешательства</tspan></text>
<rect x="300" y="70" width="520" height="75" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="314" y="97" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="314" dy="0">Данные, схема, происхождение и время</tspan></text>
<rect x="25" y="230" width="310" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="39" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="39" dy="0">Пропуск X</tspan></text>
<rect x="25" y="360" width="310" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="39" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="39" dy="0">Причина и наблюдаемые поля Z</tspan><tspan x="39" dy="22">Сравнить заполнение и индикатор</tspan></text>
<path d="M560,145 L560,185 L180,185 L180,230" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180,310 L180,360" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="230" width="310" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="419" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="419" dy="0">Редкое значение</tspan></text>
<rect x="405" y="360" width="310" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="419" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="419" dy="0">Единицы, допустимость, источник</tspan><tspan x="419" dy="22">Проверить, исправить или сохранить</tspan></text>
<path d="M560,145 L560,185 L560,185 L560,230" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560,310 L560,360" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="785" y="230" width="310" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">Спорная метка</tspan></text>
<rect x="785" y="360" width="310" height="95" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="799" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#173644"><tspan x="799" dy="0">Контекст и инструкция разметки</tspan><tspan x="799" dy="22">Просмотр по независимым критериям</tspan></text>
<path d="M560,145 L560,185 L940,185 L940,230" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M940,310 L940,360" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="200" y="560" width="720" height="95" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="214" y="587" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="214" dy="0">Одинаковый протокол оценки для методов.</tspan><tspan x="214" dy="24">Сохранить исходные значения, причины изменений и срезы.</tspan></text></svg>
