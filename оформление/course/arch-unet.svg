<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">U-Net: skip concatenation</title><desc id="desc">Сохранённая encoder map поступает в decoder в обход bottleneck. После согласования сеток выполняется concat, затем convolution/head. В отличие от residual-суммы concat увеличивает число channels; это должно учитываться следующим слоем.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="570" rx="16" fill="#f5f8f5"/>
<text x="28" y="36" font-family="Segoe UI,sans-serif" font-size="22" fill="#173644">U-Net: skip concatenation</text>
<path d="M290,146 L365,146" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M625,146 L700,146" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M830,192 L830,320" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,366 L625,366" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M160,192 C160,256.0 495,256.0 495,320" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="327.5" y="248.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#315a67">skip features</text>
<path d="M365,366 L290,366" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="100" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="160" y="136.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">encoder feature map</text>
<text x="160" y="155.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">высокое разрешение</text>
<rect x="365" y="100" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="146.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">downsample / deeper encoder</text>
<rect x="700" y="100" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="146.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">bottleneck</text>
<rect x="700" y="320" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="830" y="366.0" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">decoder upsampling</text>
<rect x="365" y="320" width="260" height="92" rx="10" fill="#dbece3" stroke="#9bb6b0"/>
<text x="495" y="356.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">concat aligned encoder map</text>
<text x="495" y="375.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">+ decoder map</text>
<rect x="30" y="320" width="260" height="92" rx="10" fill="#e9eef1" stroke="#9bb6b0"/>
<text x="160" y="356.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">pixel class head</text>
<text x="160" y="375.5" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="16" fill="#173644">H×W×C</text>
<text x="28" y="550" font-family="Segoe UI,sans-serif" font-size="13" fill="#526b75">Зелёный: модель / преобразование; серый: вход, состояние или результат. Пунктир: обход / управление.</text></svg>