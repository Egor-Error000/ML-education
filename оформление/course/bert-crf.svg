<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">CRF: выбор всей последовательности меток</title><desc id="desc">Вершины получают оценки эмиссий, рёбра — оценки переходов. Витерби выбирает максимальный путь, а обучение нормирует по сумме всех допустимых путей.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="800" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">CRF: выбор всей последовательности меток</tspan></text>
<text x="50" y="95" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="50" dy="0">Позиция 1</tspan></text>
<text x="650" y="95" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173644"><tspan x="650" dy="0">Позиция 2</tspan></text>
<rect x="50" y="150" width="220" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="64" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="64" dy="0">O</tspan></text>
<rect x="50" y="350" width="220" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="64" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="64" dy="0">B</tspan></text>
<rect x="650" y="150" width="220" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">O</tspan></text>
<rect x="650" y="350" width="220" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">B</tspan></text>
<path d="M270,190 L650,190" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270,190 L650,390" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270,390 L650,190" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270,390 L650,390" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="50" dy="0">Эмиссии: O=2; B=1</tspan></text>
<text x="650" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="650" dy="0">Эмиссии: O=0; B=3</tspan></text>
<text x="330" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="330" dy="0">Переходы: O→B = −2; остальные 0</tspan></text>
<rect x="50" y="490" width="1000" height="70" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="64" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="64" dy="0">Оценки путей: OO=2, OB=3, BO=1, BB=4.</tspan><tspan x="64" dy="24">Они включают эмиссии и переходы, а не только локальные максимумы.</tspan></text>
<rect x="50" y="645" width="460" height="100" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="64" y="672" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="64" dy="0">Обучение: суммирование путей</tspan><tspan x="64" dy="23">log Z = log(exp 2 + exp 3 + exp 1 + exp 4)</tspan><tspan x="64" dy="23">Для истинного OB: loss = log Z − 3</tspan></text>
<rect x="650" y="645" width="400" height="100" rx="10" fill="#fff1d7" stroke="#6c849d"/>
<text x="664" y="672" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="664" dy="0">Декодирование: максимум пути</tspan><tspan x="664" dy="23">Витерби → BB с оценкой 4</tspan><tspan x="664" dy="23">Обратные указатели вернут метки.</tspan></text>
<path d="M550,560 L550,600 L280,600 L280,645" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550,600 L850,600 L850,645" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
