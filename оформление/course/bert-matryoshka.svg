<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">Matryoshka: обучают несколько вложенных префиксов</title><desc id="desc">Каждый выбранный префикс получает свою нормировку и ошибку. Произвольное усечение обычного вектора не равно обучению вложенных представлений.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="720" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Matryoshka: обучают несколько вложенных префиксов</tspan></text>
<rect x="40" y="85" width="1030" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Encoder + pooling → z [D]</tspan><tspan x="54" dy="24">Один длинный вектор содержит обучаемые представления нескольких размеров</tspan></text>
<rect x="40" y="270" width="290" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">z[:64] → нормировка</tspan></text>
<rect x="40" y="395" width="290" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Сравнения → loss L64</tspan></text>
<path d="M185.0,355 L185.0,395" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,170 L555,220 L185,220 L185,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="270" width="290" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">z[:128] → нормировка</tspan></text>
<rect x="410" y="395" width="290" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Сравнения → loss L128</tspan></text>
<path d="M555.0,355 L555.0,395" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,170 L555,220 L555,220 L555,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="780" y="270" width="290" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="794" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="794" dy="0">z[:256] → нормировка</tspan></text>
<rect x="780" y="395" width="290" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="794" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="794" dy="0">Сравнения → loss L256</tspan></text>
<path d="M925.0,355 L925.0,395" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,170 L555,220 L925,220 L925,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="560" width="560" height="85" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="294" y="587" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="294" dy="0">Взвешенная сумма ошибок разных размеров</tspan><tspan x="294" dy="24">∑ λₖ Lₖ → backward в общий encoder</tspan></text>
<path d="M185,480 L185,520 L555,520 L555,560" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,480 L555,520 L555,520 L555,560" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M925,480 L925,520 L555,520 L555,560" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="690" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">После усечения норму считают заново. Нулевой префикс нельзя нормировать обычным делением.</tspan></text></svg>
