<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc"><title id="title">Оценка: независимые данные и три разных решения</title><desc id="desc">Обучение весов, выбор конфигурации и финальная оценка используют разные части данных. Калибровку и порог отказа выбирают без финального теста.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="1000" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">Оценка: независимые данные и три разных решения</tspan></text>
<rect x="40" y="85" width="1030" height="80" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Независимые документы / пользователи / запросы</tspan><tspan x="54" dy="24">Группировка и время определяют разделение до окон и пар</tspan></text>
<rect x="35" y="270" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Train</tspan></text>
<rect x="35" y="395" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Обучить encoder и голову</tspan></text>
<path d="M185.0,355 L185.0,395" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="520" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="49" y="547" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="49" dy="0">Веса модели</tspan></text>
<path d="M185.0,480 L185.0,520" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,165 L555,215 L185,215 L185,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="270" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Validation / calibration</tspan></text>
<rect x="410" y="395" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Выбрать версию, T, пороги</tspan></text>
<path d="M560.0,355 L560.0,395" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="520" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="424" y="547" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="424" dy="0">Зафиксировать решение</tspan></text>
<path d="M560.0,480 L560.0,520" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,165 L555,215 L560,215 L560,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="785" y="270" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">Test</tspan></text>
<rect x="785" y="395" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">Одна итоговая оценка</tspan></text>
<path d="M935.0,355 L935.0,395" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="785" y="520" width="300" height="85" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="799" y="547" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="799" dy="0">Метрика + неопределённость</tspan></text>
<path d="M935.0,480 L935.0,520" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M555,165 L555,215 L935,215 L935,270" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="35" dy="0">Повторная настройка по test превращает его в validation.</tspan></text>
<rect x="40" y="720" width="420" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="54" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="54" dy="0">Тот же test → метод A</tspan><tspan x="54" dy="24">Результат aᵢ для каждого запроса i</tspan></text>
<rect x="650" y="720" width="420" height="90" rx="10" fill="#e4edf7" stroke="#6c849d"/>
<text x="664" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="664" dy="0">Тот же test → метод B</tspan><tspan x="664" dy="24">Результат bᵢ для того же запроса i</tspan></text>
<rect x="260" y="880" width="600" height="85" rx="10" fill="#e3f2e7" stroke="#6c849d"/>
<text x="274" y="907" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="274" dy="0">Парный bootstrap: одни выбранные индексы i</tspan><tspan x="274" dy="24">для aᵢ и bᵢ → разность метрик</tspan></text>
<path d="M250,810 L250,922 L260,922" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860,810 L860,845 L750,845 L750,880" fill="none" stroke="#315a67" stroke-width="2" marker-end="url(#arrow)"/></svg>
