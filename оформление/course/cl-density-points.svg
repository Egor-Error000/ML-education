<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc"><title id="title">DBSCAN: связь через границу не продолжает кластер</title><desc id="desc">D основная, B,C,E граничные, A и F шум при eps=1.1 и min_samples=4, считая сам объект.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315a67"/></marker></defs>
<rect width="1120" height="630" fill="#f7f9fc"/>
<text x="28" y="35" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#173644"><tspan x="28" dy="0">DBSCAN: связь через границу не продолжает кластер</tspan></text>
<circle cx="130" cy="500" r="9" fill="#bd5252"/>
<text x="144" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="144" dy="0">A</tspan></text>
<circle cx="130" cy="425" r="9" fill="#cf9b36"/>
<text x="144" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="144" dy="0">B</tspan></text>
<circle cx="205" cy="500" r="9" fill="#cf9b36"/>
<text x="219" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="219" dy="0">C</tspan></text>
<circle cx="205" cy="425" r="9" fill="#2a8a65"/>
<text x="219" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="219" dy="0">D</tspan></text>
<circle cx="280" cy="425" r="9" fill="#cf9b36"/>
<text x="294" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="294" dy="0">E</tspan></text>
<circle cx="505" cy="125" r="9" fill="#bd5252"/>
<text x="519" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#173644"><tspan x="519" dy="0">F</tspan></text>
<circle cx="205" cy="425" r="82.5" fill="none" stroke="#2a8a65" stroke-width="2" stroke-dasharray="6 5"/>
<text x="620" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="620" dy="0">Радиус ε=1.1 вокруг D:</tspan><tspan x="620" dy="26">B, C, D, E → 4 точки</tspan><tspan x="620" dy="26">D — основная точка</tspan></text>
<text x="620" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#173644"><tspan x="620" dy="0">A далеко от D: √2 &gt; ε.</tspan><tspan x="620" dy="26">Близость A к B и C</tspan><tspan x="620" dy="26">не делает A достижимой</tspan><tspan x="620" dy="26">от основной точки.</tspan></text>
<text x="80" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#173644"><tspan x="80" dy="0">Зелёный: основная. Жёлтый: граница. Красный: шум. Координатный масштаб одинаков по осям.</tspan></text></svg>
